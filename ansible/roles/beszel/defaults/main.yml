---
# Beszel hub (zai-ops#3): the monitoring dashboard agents report to. A single
# Go binary with PocketBase (SQLite) inside, run natively under systemd.
#
# beszel_version, beszel_host, beszel_port and beszel_superuser_email are in
# group_vars/all/main.yml, not here: the agent role installs the same release
# and talks to the same port as the same superuser, and the proxy routes the
# same host.

# The release tarball and its SHA-256. Bump the checksum with beszel_version,
# and take it from the release's own beszel_<version>_checksums.txt rather than
# from a copy. get_url fails the run on a mismatch.
beszel_hub_url: "https://github.com/henrygd/beszel/releases/download/v{{ beszel_version }}/beszel_linux_amd64.tar.gz"
beszel_hub_sha256: "c0cbab161f322426228419fbbeab4163dded6464a537cc1e2f92e090892f6368"

# Wildcard, never a literal 10.1.1.x. A container address loses a cold-boot race
# with systemd-networkd and the service comes up silently loopback-only (see
# sync_relay_host).
beszel_bind: "0.0.0.0"

beszel_user: beszel
beszel_group: beszel
beszel_bin: /usr/local/bin/beszel
# Where the downloaded tarball is kept, named by version, so a replay at the
# same version downloads nothing and a bump fetches the new one.
beszel_download_dir: /opt/beszel
# The PocketBase data dir: data.db (users, systems, metrics history), the hub's
# SSH key, and nothing else. The unit's only writable path.
beszel_data_dir: /var/lib/beszel

# The hub's public URL, rendered as APP_URL. PocketBase builds links and, from
# #3 step 4, the OIDC redirect URL from it.
beszel_app_url: "https://{{ beszel_host }}"

# The superuser is Ansible's own account for the admin API on 127.0.0.1; the
# admin is the login people use until Corliss OIDC replaces it (#3 step 4).
# Both need an email-shaped name, and neither address receives mail. The
# superuser's is in group_vars/all/main.yml, as are both passwords.
beszel_admin_email: "admin@{{ cluster_domain }}"

# Sign-in through Corliss (zai-ops#3 step 4). The hub is Corliss's second
# confidential OIDC client, which only roster admins can complete; the secret is
# corliss_beszel_oidc_client_secret in group_vars, which corliss renders too.
#
# The client id is a local default: keep it equal to the corliss role's
# corliss_beszel_oidc_client_id, the convention openwebui_oidc_client_id uses.
beszel_oidc_client_id: beszel
# What the sign-in button names: the cluster, which is what an admin signs in to.
beszel_oidc_display_name: "{{ cluster_domain }}"
# Corliss's public origin, where the admin's browser goes and the id_token's
# `iss`. Mirrors corliss_url.
beszel_corliss_public_url: "https://{{ cluster_domain }}"
# Corliss's INTERNAL address, for the two calls the hub makes itself: the token
# exchange and the JWKS fetch. One hop over vmbr1 rather than out through the
# proxy, the rule for every call between two CTs. The port mirrors corliss_port.
beszel_corliss_internal_url: "http://{{ hostvars['corliss'].ansible_host }}:8000"

# Mail for alerts (zai-ops#3 step 5): sent through the cluster relay (smtp_url)
# to alert_email, both set with scn-config's Set SMTP. Off unless both are set.
# The relay must accept this sender, as it must the PDS's.
beszel_email_from_address: "monitor@{{ cluster_domain }}"
beszel_email_from_name: "SCN monitor"

# What every system the hub knows is watched for. The one place alert policy
# lives: tasks/alerts.yml writes these onto every system on every run, and puts
# back a value or delay changed in the hub's UI. name is Beszel's alert kind;
# value is a percentage where the kind has one; min is minutes (how long down,
# or how long over the value, before it sends).
beszel_alerts:
  - { name: Status, value: 0, min: 5 }
  - { name: Disk, value: 90, min: 10 }
  - { name: Memory, value: 90, min: 10 }
  # Fires on the first report of any failed unit; the agent reads systemd every
  # ten minutes, so min does nothing here.
  - { name: SystemdFailed, value: 0, min: 0 }
