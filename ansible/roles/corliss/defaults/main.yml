---
# corliss — the cluster's ATProto→OIDC login bridge (Django). Internal-only on
# vmbr1; reached from the LAN only through the Caddy edge, fronted like
# litellm/open-webui/happyview.
#
# The app lives in its own repo (Z-Space-Society/Corliss) and is cloned onto
# the CT at a pinned ref, like every other role installs a pinned release —
# it used to be a sub-app of this repo, rsync'd off the control node's own
# checkout. See docs/decisions/0006-corliss-standalone-apex.md.

# Upstream app source. Public repo, so the clone needs no credentials — the CT
# reaches GitHub over the host's NAT. Pin to a TAG, never a branch: `git pull`
# on CT 100 updates the blueprint, but the app's version is this value, and
# bumping it is a reviewable commit like any other version pin in this repo. A
# branch would make replays silently pick up whatever moved upstream in between.
# A tag (not a bare SHA) also keeps `git describe --tags` in the CT's checkout
# reporting the release the CT is actually running.
#
# NOTE: unrelated to the `version` field in the app's pyproject.toml. That is
# package metadata, unread by anything (Corliss sets `package = false`); this is
# the git ref ansible.builtin.git checks out.
corliss_repo_url: https://github.com/Z-Space-Society/Corliss.git
# v0.6.0 ends relying-party sessions instead of waiting them out: corliss mints
# an OIDC logout_token and POSTs it to open-webui on sign-out, on a revocation
# push, and when a reconcile run deactivates someone. That closes the one hole
# GATE could not reach — v0.5.0 refuses a revoked member at /oidc/authorize, but
# open-webui only goes there when it has no session of its own, so revocation
# used to take effect at open-webui's next token expiry.
#
# **Needs two things provisioned first, or it is inert or broken:** the `redis`
# CT (open-webui cannot revoke an already-issued JWT without it), and the
# OIDC_BACKCHANNEL_LOGOUT_URI key in corliss.env.j2. A pin below v0.6.0 simply
# ignores that key, so the env file is safe either way.
#
# Note what this does NOT change: open-webui's JWT_EXPIRES_IN stays 4h. Immediate
# revocation now depends on a message being delivered, and the short expiry is
# the bound that still holds when it isn't.
#
# v0.5.0 enforces membership: /oidc/authorize, /api/ and the post-login resume
# refuse anyone who is not a member, so signing in with an atproto handle no
# longer reaches open-webui on its own. **This is the first pin whose safety
# depends on the membership cache being complete** — replay it only against a
# reconcile run reporting zero unresolved and zero orphans (the /manage/ Preview
# button), because an unresolved DID is a real member who gets locked out the
# moment this lands. Roster admins pass with no cache row at all, which is what
# keeps a rebuilt cluster enterable, and /manage/ and /admin/login/ stay
# ungated for the same reason — see the URL surface in docs/roles/corliss.md.
#
# v0.4.1 presents the registry's public Host when reaching it at its internal
# address — without it every reconcile run fails with HTTP 421 "Unknown host",
# so v0.4.0 is not usable with the internal MEMBERSHIP_REGISTRY_URL below.
#
# v0.4.0 reconciles membership from the registry, and serves the cluster console
# at /manage/. This is the membership half of the prime directive: until now the
# cache could only be filled by pushes, so a corliss rebuilt from nothing had no
# way to learn about grants that had already happened. Needs the three
# MEMBERSHIP_REGISTRY_* keys in corliss.env.j2 (a pin below v0.4.0 ignores them);
# reconciliation reports itself unconfigured until RECONCILE_TOKEN is also
# installed registry-side by scn-ops' `npm run deploy` — see Secrets in
# docs/roles/corliss.md.
#
# v0.3.2 adds the home page, the /api/ page and the nav's identity/admin menu —
# the surfaces API_URL and MANAGE_URL below feed — and reads the admin roster
# from the service DID's repo (SCN_SERVICE_DID). Those four env keys are set in
# corliss.env.j2; a pin BELOW v0.3.2 simply ignores them, so the env file is
# safe either way, but the links won't render.
#
# v0.3.0 added atproto membership caching, so a login no longer costs a live
# lookup against the user's PDS on every request.
#
# Since v0.2.1 the running version is stamped in every page footer, so which
# build is serving can be read off the site itself instead of by SSHing to the
# CT. It resolves from `git describe --tags` against the checkout this role
# clones — which works only because that clone is a full one at a tag (see the
# git task; don't add `depth:`), and reads back exactly the value pinned here.
#
# Floor: v0.2.0 adopted the uv project workflow (pyproject.toml + uv.lock
# replace requirements.txt, Python 3.14, Django 6.1). This role's `uv sync
# --locked` and v0.1.0 aren't compatible in either direction, so don't pin back
# past v0.2.0 without reverting the uv tasks with it.
corliss_version: v0.6.0

# Port gunicorn binds. 8000 matches the app's own local-dev convention
# (PUBLIC_BASE_URL=http://localhost:8000 in .env.example). Bind 0.0.0.0 (not
# loopback) — same posture as litellm/open-webui — the Caddy edge reaches this
# CT over vmbr1, and the security boundary is the network, not the bind address.
corliss_port: 8000
corliss_host: "0.0.0.0"
corliss_gunicorn_workers: 2

# Dedicated unprivileged service account (nologin) the daemon runs as.
corliss_user: corliss
corliss_group: corliss

# On-disk layout, all under /opt like every other native service. src/ is the
# cloned app checkout (reset to corliss_version on every run); venv/ is layered
# on top of it — `uv sync` builds it there rather than at the source tree's
# default src/.venv because the tasks set UV_PROJECT_ENVIRONMENT to this path.
#
# The uv-managed CPython is deliberately placed UNDER corliss_home (not uv's
# default ~/.local/share/uv/python), same as open-webui, so that: (a) the
# recursive chown at the end of the role owns it, and (b) ProtectHome=true in
# the unit — which hides /root — never hides the interpreter the daemon execs.
corliss_home: /opt/corliss
corliss_src: "{{ corliss_home }}/src"
corliss_venv: "{{ corliss_home }}/venv"
corliss_python_install_dir: "{{ corliss_home }}/python"

# uv — provisions the venv from the checkout's pyproject.toml + uv.lock, and
# fetches the managed CPython to build it against. Installed reproducibly from
# a pinned, checksummed release tarball (NOT `curl | sh` of a moving
# installer), same idiom and same pin as the open-webui role. Like open-webui,
# corliss DOES need uv's managed-CPython fetch: the app requires Python 3.14
# (pinned in its committed .python-version) and Debian 13 ships 3.13.
#
# There is deliberately no corliss_python_version var here: the app's
# .python-version is the single source of truth and uv reads it off the
# checkout, so a role var would only be a second copy to drift.
# Releases: https://github.com/astral-sh/uv/releases
corliss_uv_version: "0.11.25"
corliss_uv_sha256: "1db18b5e76fa645a7f3865773139bdec8e2d46adbdbb35e7410b34fa8015ccd2"
corliss_uv_url: "https://github.com/astral-sh/uv/releases/download/{{ corliss_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
corliss_uv_install_dir: /usr/local/bin
corliss_uv_bin: "{{ corliss_uv_install_dir }}/uv"

# Per-request HTTP timeout (seconds) for uv's downloads. uv defaults to 30s,
# which the managed-CPython tarball (tens of MB, fetched on a cold CT) can blow
# past on the host's NAT'd link. Corliss's own dependency set is small — no
# torch-sized wheel like open-webui's — so this is a modest lift, not
# open-webui's 900. uv caches under /root/.cache/uv, so a re-run after a
# partial download resumes rather than refetching.
corliss_uv_http_timeout: 180

# Config + secrets live under /etc, like every other role. The env file (0600,
# root-only) carries DATABASE_URL/SECRET_KEY/etc; the keys/ dir holds the two
# PEM signing keys, group-readable so the daemon (not just systemd) can read
# them directly — Django loads them itself via ATPROTO_EC_PRIVATE_KEY_PATH /
# OIDC_RSA_PRIVATE_KEY_PATH, unlike the env file which only systemd reads.
corliss_config_dir: /etc/corliss
corliss_env_file: "{{ corliss_config_dir }}/corliss.env"
corliss_keys_dir: "{{ corliss_config_dir }}/keys"
corliss_atproto_ec_key_path: "{{ corliss_keys_dir }}/atproto_ec.pem"
corliss_oidc_rsa_key_path: "{{ corliss_keys_dir }}/oidc_rsa.pem"

# Postgres role + database this role provisions on the postgres CT (same
# delegated idiom as litellm/open-webui/happyview). Password is the
# auto-generated corliss_db_password from group_vars/all/main.yml.
corliss_db_name: corliss
corliss_db_user: corliss
corliss_database_url: "postgresql://{{ corliss_db_user }}:{{ corliss_db_password }}@{{ hostvars['postgres'].ansible_host }}:5432/{{ corliss_db_name }}"

# Public URL: the APEX domain, not a subdomain (was account.<domain> until
# ADR-0006). Anchors PUBLIC_BASE_URL, the atproto OAuth client_id, and the OIDC
# issuer — and the issuer is why it's the apex: an OIDC issuer of
# https://example.com must serve discovery at https://example.com/.well-known/
# openid-configuration, so a bare-origin issuer needs the bare origin. The app
# keeps its human/atproto surface under /auth/* and leaves / to the account
# page. NOTE: the origin cert must cover the apex, not just *.<domain>.
corliss_url: "https://{{ cluster_domain }}"
corliss_allowed_hosts:
  - "{{ cluster_domain }}"
  # 127.0.0.1: the role's own provision-time smoke test hits the app over
  # loopback (Verify the corliss OIDC discovery document responds), and
  # Django's ALLOWED_HOSTS check 400s any Host header not on this list —
  # without this, the health check fails even though gunicorn is up fine.
  - "127.0.0.1"
  # This CT's own internal address, because the SCN registry pushes membership
  # events to it CT-to-CT over vmbr1 rather than out through Caddy — so the
  # Host header on those POSTs is the bare `10.1.1.<ctid>:8000`, which the two
  # entries above do not cover. Django rejects a Host that is not listed here
  # with a 400 *before* the view runs, so without this the push fails in the
  # worst possible way: the endpoint looks deployed, the registry's Lua logs a
  # 400 it cannot explain, and the membership cache silently stays empty.
  # Derived from the CTID via hostvars, never hardcoded (same rule as
  # corliss_database_url).
  - "{{ hostvars['corliss'].ansible_host }}"

# The one OIDC relying party today: Open WebUI. client_id is a LOCAL default
# here (not reached into the open-webui role's vars) — mirror it in
# open-webui's own defaults (openwebui_oidc_client_id) and keep both in sync,
# same convention as openwebui_litellm_port/litellm_port.
corliss_oidc_client_id: open-webui
corliss_oidc_redirect_uris:
  - "https://chat.{{ cluster_domain }}/oauth/oidc/callback"

# Open WebUI's back-channel logout endpoint — where corliss POSTs a logout_token
# on sign-out and on revocation. INTERNAL (derived from open-webui's CTID via
# hostvars), unlike the redirect URI above: that one is a URL a member's browser
# follows, this one is a call between two CTs on the same bridge. Same
# distinction, and the same reasoning, as corliss_membership_registry_url below.
#
# The port is a LOCAL default rather than a reach into the open-webui role's
# vars (a role default isn't a reliable host fact from this play) — keep it in
# sync with openwebui_port, same convention as corliss_oidc_client_id mirroring
# openwebui_oidc_client_id.
corliss_openwebui_port: 8080
corliss_oidc_backchannel_logout_uri: "http://{{ hostvars['open-webui'].ansible_host }}:{{ corliss_openwebui_port }}/oauth/backchannel-logout"

# The other cluster surfaces corliss links out to. All three derive from
# cluster_domain exactly like corliss_url above — just different subdomains, so
# a `zai-set-domain` moves every link at once and none of them can drift. Each
# is the SAME public origin the corresponding Caddy route already serves
# (caddy_proxy_hosts), reached through the edge rather than CT-to-CT, because
# these are hrefs a member's browser follows, not service-to-service calls.
#
# Blank hides the corresponding link/block in the app, which is why they're
# derived rather than required: nothing here fails when a surface is absent.
corliss_chat_url: "https://chat.{{ cluster_domain }}"     # nav "Chat" link
corliss_api_url: "https://api.{{ cluster_domain }}"       # base URL shown on /api/
corliss_manage_url: "https://manage.{{ cluster_domain }}"  # admin block's console link

# The HappyView instance corliss reads membership back out of, for reconciliation
# (`manage.py reconcile_membership`, and the button on corliss's own /manage/).
#
# **Internal, not the public origin.** Unlike chat/api/manage above — hrefs a
# member's browser follows — this is a service-to-service call between two CTs on
# the same bridge, so it goes direct: one hop over vmbr1, never leaving the
# cluster. `https://view.<domain>` would route out through the host's NAT, across
# the public internet and Cloudflare, and back in through the proxy CT.
#
# That matters because **this is the recovery path**. Reconciliation is what
# refills an empty MembershipCache on a rebuilt cluster, and it is meant to run
# at boot; making it depend on public DNS, Cloudflare and the proxy CT all being
# healthy is a long chain for something whose whole job is to work when little
# else does. One internal hop depends on the two CTs and nothing else. It also
# means the token is not the only thing standing in front of an
# internet-reachable endpoint.
#
# Derived from the inventory, not hardcoded — same idiom as this role's own
# `corliss_database_url` (`hostvars['postgres']`) and open-webui's
# `openwebui_openai_base_url` (`hostvars['litellm']`), so the CTID assignment
# stays the single source. Deliberately unguarded, like both of those: a
# happyview with no CTID assigned fails the play loudly rather than rendering a
# blank URL that would look like a working config.
#
# The port is a LOCAL default rather than a reach into happyview's role defaults,
# for the reason open-webui records: a role default isn't a reliable host fact
# from another play. It must match the `view.<domain>` entry in
# `caddy_proxy_hosts`.
#
# The address coupling is the one `CORLISS_PUSH_URL` already accepts in the other
# direction, and degrades the same gentle way: a wrong address means
# reconciliation reports a transport failure, visibly, while the registry and the
# push keep working.
corliss_membership_registry_url: "http://{{ hostvars['happyview'].ansible_host }}:{{ corliss_membership_registry_port }}"
corliss_membership_registry_port: 3000

# The Host header corliss presents on that internal call. happyview routes by
# virtual host and answers HTTP 421 "Unknown host" to a request whose Host is a
# bare 10.1.1.x — the edge normally preserves the public name on the way
# through, so going direct means presenting it ourselves. Same derivation as the
# `view.<domain>` entry in caddy_proxy_hosts, which is the name it routes on.
corliss_membership_registry_host: "view.{{ cluster_domain }}"
