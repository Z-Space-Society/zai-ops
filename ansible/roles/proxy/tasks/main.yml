---
# Install and configure Caddy as the reverse-proxy edge. A single apt package,
# and the config is a declarative Caddyfile rendered from caddy_proxy_hosts, so
# the CT keeps no unreproducible state (routes in git, cert in the vault).

# Routes derive their public domain from cluster_domain (api.{{ cluster_domain }}),
# which is per-cluster runtime data. Fail fast with an actionable message if routes
# exist but the domain was never set, instead of a raw undefined-variable error
# when the Caddyfile templates — mirrors the CTID assert in provision.yml.
- name: Require cluster_domain when proxy routes are defined
  ansible.builtin.assert:
    that: cluster_domain is defined and (cluster_domain | string | length) > 0
    fail_msg: >-
      caddy_proxy_hosts has routes but cluster_domain is unset —
      run: zai-set-domain <domain>
  when: caddy_proxy_hosts | length > 0

# The template branches on the exact mode string, so a typo would render a
# Caddyfile meant for no mode at all, and `caddy validate` checks syntax, not
# intent. Forcing origin_ca without the vault material would otherwise fail
# inside a no_log task, which hides the undefined-variable error it hit.
- name: Require a known caddy_tls_mode, with the material origin_ca needs
  ansible.builtin.assert:
    that:
      - caddy_tls_mode in ['origin_ca', 'acme', 'none']
      - >-
        caddy_tls_mode != 'origin_ca' or
        (cloudflare_origin_cert is defined and cloudflare_origin_key is defined)
    fail_msg: >-
      caddy_tls_mode is '{{ caddy_tls_mode }}': it must be origin_ca, acme or
      none, and origin_ca needs cloudflare_origin_cert and cloudflare_origin_key
      in the vault.

# Caddy from Debian BACKPORTS, version-pinned. Still Debian-built and
# Debian-signed, so this keeps the original "no third-party apt key" property
# while getting past the 2.6.2 the base suite ships. See defaults/main.yml for
# why that version floor matters. Ships the `caddy` user, /etc/caddy/,
# /var/lib/caddy and caddy.service, exactly as the base-suite package does, so
# nothing else in this role changes.
#
# deb822_repository needs python3-debian on the target; it is not installed on a
# fresh Debian 13 CT.
- name: Ensure python3-debian is present for deb822 repository management
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true

- name: Add the Debian backports suite
  # Signed by the distro's own archive keyring, already on the box. Backports
  # is NotAutomatic, so adding it alone changes nothing about any other package;
  # the pin below is what makes it the source for caddy specifically.
  ansible.builtin.deb822_repository:
    name: debian-backports
    types: [deb]
    uris: http://deb.debian.org/debian
    suites: ["{{ caddy_backports_suite }}"]
    components: [main]
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    enabled: true
    state: present
  register: caddy_backports_repo

- name: Pin caddy to the backports suite
  # A template, not copy with inline content, for a specific reason:
  # `ansible_managed` is populated by the template module only and is undefined
  # in a copy task, so the inline version failed at arg finalisation with
  # "'ansible_managed' is undefined". Every other rendered file in this repo is
  # a .j2 carrying that header; this one now matches.
  ansible.builtin.template:
    src: caddy-backports.pref.j2
    dest: /etc/apt/preferences.d/caddy-backports.pref
    owner: root
    group: root
    mode: "0644"
  register: caddy_backports_pin

- name: Refresh the apt cache after a repository or pin change
  ansible.builtin.apt:
    update_cache: true
  when: caddy_backports_repo is changed or caddy_backports_pin is changed

- name: Install Caddy
  # Pinned exactly, so an upgrade is a reviewable commit here rather than
  # whatever the archive happens to hold on the day of a replay. Note this
  # UPGRADES an existing 2.6.2 install and therefore restarts Caddy: on the
  # LAN-facing edge that is a brief outage of every public route. The Caddyfile
  # is validated with the new binary before it is deployed (the template task's
  # validate:) and again afterwards, so a syntax incompatibility fails the play
  # instead of leaving the edge down.
  ansible.builtin.apt:
    name: "caddy={{ caddy_apt_version }}"
    state: present
    update_cache: true

# Cloudflare Origin CA cert + key (long-lived, no ACME) come from the vault, in
# origin_ca mode only. Gated on the mode, not caddy_tls_enabled: acme serves TLS
# too but has no vault material, so these vars are undefined there. Installed
# before the Caddyfile so the `tls` directive's files exist when the config is
# validated/started. Key is 0600 owned by the caddy daemon user; the cert is
# world-readable (it's public).
- name: Install the Cloudflare Origin CA certificate
  ansible.builtin.copy:
    content: "{{ cloudflare_origin_cert }}"
    dest: "{{ caddy_cert_path }}"
    owner: caddy
    group: caddy
    mode: "0644"
  no_log: true
  when: caddy_tls_mode == 'origin_ca'
  notify: reload caddy

- name: Install the Cloudflare Origin CA private key
  ansible.builtin.copy:
    content: "{{ cloudflare_origin_key }}"
    dest: "{{ caddy_key_path }}"
    owner: caddy
    group: caddy
    mode: "0600"
  no_log: true
  when: caddy_tls_mode == 'origin_ca'
  notify: reload caddy

# Render the routes. `validate` is the nginx -t analog — a bad Caddyfile (e.g. an
# upstream service with no CTID) fails the task instead of being deployed.
- name: Deploy the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: caddy
    group: caddy
    mode: "0644"
    validate: "caddy validate --adapter caddyfile --config %s"
  notify: reload caddy

- name: Ensure caddy is started and enabled
  ansible.builtin.systemd:
    name: caddy
    state: started
    enabled: true

# Flush the reload now so the running daemon reflects the just-deployed config
# before we assert on it.
- name: Apply pending caddy reloads before validating
  ansible.builtin.meta: flush_handlers

# Final guard: confirm the live config file is valid (the nginx -t analogue).
- name: Validate the deployed Caddyfile
  ansible.builtin.command:
    cmd: caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
  changed_when: false
