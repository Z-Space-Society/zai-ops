---
# Habitat (the `pear` binary), an Organizational Data Server on AT Protocol,
# deployed as a TIME-BOXED EVALUATION. See docs/decisions/0008-habitat-evaluation.md.
#
# This instance is deliberately wired to nothing: no corliss vars point at it, no
# relay reads it, and it holds no cluster members. It exists to answer questions
# the vendor's email replies did not (durable scoped service credentials, whether
# the delegable `manager` role is real, revocation timing) against a running
# server we control. Membership stays where ADR-003 and ADR-006 put it.

# Upstream commit to build. A COMMIT SHA, not a tag, and that is not a shortcut.
#
# Habitat's tags do not version this codebase. All 28 are `v0.0.x-testing-N` from
# mid-2024 and point at the previous architecture, when the project was
# github.com/eagraf/habitat-new: go 1.22, a single `cmd/node` binary, an npm
# frontend under frontend/, and a Makefile as the build system. None of cmd/pear,
# go.work, the pnpm workspace or any HABITAT_* flag exists there. The
# pear/OpenSocial tree that this role builds, that the API docs describe, and
# that ghcr.io/habitat-network/pear ships lives only on an UNTAGGED main.
#
# So upgrades are a deliberate re-pin against upstream main rather than a version
# bump, and there is no changelog to read first. The layout probe in
# tasks/main.yml asserts the checkout actually has the pear-era shape, so a wrong
# pin fails with that reason instead of several tasks deeper with a confusing
# pnpm error.
habitat_version: "ace441b19038ce870e66127df7ef70b2543743ff"

habitat_repo_url: "https://github.com/habitat-network/habitat"

# Port only. pear has NO bind-address flag: the listen host is not
# configurable, and it serves on all interfaces. So unlike postgres, happyview
# and the sync relay there is no literal-IP-vs-wildcard footgun to get wrong
# here, and no habitat_host var to set: the cold-boot race those roles guard
# against cannot be configured into existence.
habitat_port: 8000

habitat_user: habitat
habitat_group: habitat
habitat_home: /opt/habitat
habitat_bin: /opt/habitat/bin/pear
habitat_keygen_bin: /opt/habitat/bin/keygen
habitat_src: /opt/habitat/src
habitat_config_dir: /etc/habitat
habitat_env_file: /etc/habitat/habitat.env

habitat_db_name: habitat
habitat_db_user: habitat
# ParseDialect() in internal/db/db.go dispatches on the literal prefix "postgres",
# so both postgres:// and postgresql:// select the GORM Postgres driver. Anything
# else falls through to a "" dialect. The password is hex (see group_vars) so it
# needs no percent-encoding here.
habitat_database_url: "postgres://{{ habitat_db_user }}:{{ habitat_db_password }}@{{ hostvars['postgres'].ansible_host }}:5432/{{ habitat_db_name }}"

# Public origin. Habitat bakes this into identities: org DIDs are minted against
# it and the OAuth server issues "https://"+domain as its issuer, so changing it
# later orphans everything created under the old name. HABITAT_DOMAIN takes a
# bare hostname with NO scheme; pear prepends https:// itself where it needs a
# URL, which is why there is no habitat_public_url counterpart to happyview's
# PUBLIC_URL. Must match the Caddy route domain in the proxy role.
habitat_domain: "habitat.{{ cluster_domain }}"

# --- Blob storage ------------------------------------------------------------
# Blobs go to Garage over S3, which is what the SCN spec asks for.
#
# Verified in the source rather than assumed: internal/spaces/blobs.go blank-imports
# fileblob, gcsblob, memblob AND s3blob, and cmd/pear/main.go imports
# internal/spaces, so all four schemes are registered in the built binary. The
# driver set is confirmed again at build time by the assert in tasks/main.yml,
# because which schemes work is a property of the build rather than of the flag's
# help text.
habitat_blob_use_garage: true
habitat_s3_bucket: "habitat-blobs"
habitat_s3_key_name: "habitat"

# Local-disk fallback, used when habitat_blob_use_garage is false. Also the path
# the unit grants write access to in that case.
habitat_blob_dir: /var/lib/habitat/blobs

# Garage's S3 port and region are LOCAL defaults, deliberately duplicated rather
# than read out of the object_store role: a role default is not a reliable host
# fact from another play, the same reason corliss keeps its own
# corliss_membership_registry_port. Both must match object_store's
# garage_region / its S3 API port; keep them in sync by convention.
habitat_s3_port: 3900
habitat_s3_region: "garage"

# gocloud s3blob connection string. Garage is not AWS, so it needs an explicit
# endpoint, path-style addressing and plain HTTP over vmbr1. Credentials travel
# via the standard AWS env vars in the env template rather than inline here, so
# they stay out of the process list and out of any log that echoes the URL.
#
# UNVERIFIED against a running Garage: check the parameter spelling against the
# gocloud version in the root go.mod on first run. A wrong endpoint does not
# error clearly, it tries real AWS. The journal is where this shows up.
#
# Jinja's conditional expression is lazy, so hostvars['object-store'] is only
# dereferenced when the flag is true, so this stays resolvable on a cluster
# that has no object store assigned.
habitat_blob_bucket: >-
  {{
    ('s3://' ~ habitat_s3_bucket
     ~ '?region=' ~ habitat_s3_region
     ~ '&endpoint=' ~ hostvars['object-store'].ansible_host ~ ':' ~ habitat_s3_port
     ~ '&disable_https=true&use_path_style=true')
    if habitat_blob_use_garage | bool
    else ('file://' ~ habitat_blob_dir)
  }}

# --- Build toolchain ---------------------------------------------------------
# Versions mirror build/debian/pear/Dockerfile, which is the authoritative recipe
# upstream actually ships. Note it uses node:22-slim and pnpm 11.5.1 even though
# .prototools pins node 26.7.0 / pnpm 11.25.0. The Dockerfile wins here because
# it is the combination they build and publish with, and Node 22 is already the
# version the happyview role installs on its CT.
habitat_node_major: 22
habitat_pnpm_version: "11.5.1"

# Go toolchain. cmd/pear/go.mod declares `go 1.26.3` but the Dockerfile builds
# with golang:1.27-bookworm, and Debian 13 ships older than either, so the
# toolchain is fetched as a pinned, checksummed tarball, same posture as the
# Garage binary and uv. Bump the version and the checksum together; the published
# checksum is at https://go.dev/dl/ beside the tarball.
habitat_go_version: "1.27.1"
habitat_go_tarball: "go{{ habitat_go_version }}.linux-amd64.tar.gz"
habitat_go_url: "https://go.dev/dl/{{ habitat_go_tarball }}"
# get_url fails the run on a mismatch. Recompute after a bump from
# https://go.dev/dl/?mode=json (the `sha256` field beside the tarball).
habitat_go_sha256: "63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445"
habitat_go_root: /usr/local/go
