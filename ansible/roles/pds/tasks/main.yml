---
# Provision the in-house PDS (atproto-pds) natively under systemd.
# Build-from-source like happyview: install the Rust toolchain, clone the
# atproto-crates workspace at the pinned revision, cargo build the two
# binaries, then clean the build tree (~6 GB) — a cold first run is 15–30 min.
#
# The PDS is SQLite-only with no Postgres / no other service dependency, so
# unlike happyview/sync-relay this role has no delegated provisioning tasks on
# the postgres CT. Ordering in provision.yml is cosmetic.

# --- Service account + directories -----------------------------------------
- name: Create the pds system group
  ansible.builtin.group:
    name: "{{ pds_group }}"
    system: true

- name: Create the pds system user
  ansible.builtin.user:
    name: "{{ pds_user }}"
    group: "{{ pds_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ pds_home }}"
    create_home: false

- name: Create the pds home, bin, config and data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    # home/bin: root-owned, holds the installed binaries.
    # config dir: root-only (the env file is 0600 and only systemd reads it).
    # data dir: OWNED BY THE DAEMON — unlike happyview (state in Postgres),
    # the PDS writes accounts.sqlite + per-actor repos + blobs here at runtime.
    - { path: "{{ pds_home }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ pds_bin_dir }}", owner: root, group: root, mode: "0755" }
    - { path: "{{ pds_config_dir }}", owner: root, group: root, mode: "0750" }
    - { path: "{{ pds_data_dir }}", owner: "{{ pds_user }}", group: "{{ pds_group }}", mode: "0750" }

# --- Build dependencies ------------------------------------------------------
- name: Install system build dependencies
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - git
      - libssl-dev
      - pkg-config
    state: present
    update_cache: true

# Rust toolchain via rustup — minimal profile to keep install lean (no
# rust-docs, rust-src, etc.). Installed under /root/.cargo; the build runs as
# root. Same idiom as the happyview role.
- name: Check whether the Rust toolchain is installed
  ansible.builtin.command: rustc --version
  register: pds_rust_installed
  changed_when: false
  failed_when: false
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_env.PATH }}"

- name: Install the Rust toolchain via rustup
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://sh.rustup.rs |
      sh -s -- -y --profile minimal --default-toolchain {{ pds_rust_channel }}
    creates: /root/.cargo/bin/rustc
  when: pds_rust_installed.rc != 0

# --- Clone + build ------------------------------------------------------------
- name: Clone the atproto-crates workspace at the pinned revision
  ansible.builtin.git:
    repo: "{{ pds_repo_url }}"
    dest: "{{ pds_src }}"
    version: "{{ pds_revision }}"
    force: true
  register: pds_clone
  # Bump pds_revision (defaults/main.yml) to upgrade: the clone's `changed`
  # flag is the rebuild trigger below (same idiom as happyview). Full clone,
  # no `depth:` — keeps a local head we can diff against the pin and inspect.

- name: Check whether a pds binary is already installed
  ansible.builtin.stat:
    path: "{{ pds_bin }}"
  register: pds_bin_stat

- name: Build the pds binaries from source (cargo build --release)
  # Build when: the clone just updated to a new revision, OR the binary isn't
  # installed yet (first run). Skipped otherwise — no `creates:` guard so the
  # deleted target/ dir below doesn't trick an idempotent re-run into
  # rebuilding. Defaults stay ON: sqlite storage + the four features from
  # defaults/main.yml; the rest of the workspace is a no-op to `--bin pds`.
  ansible.builtin.command:
    cmd: >-
      /root/.cargo/bin/cargo build --release
      --features {{ pds_build_features }}
      --bin pds --bin atproto-pds-admin
    chdir: "{{ pds_src }}"
  environment:
    PATH: "/usr/local/bin:/root/.cargo/bin:{{ ansible_env.PATH }}"
    HOME: /root
  when: (pds_clone is changed) or (not pds_bin_stat.stat.exists)
  notify: restart pds

- name: Install the built binaries
  ansible.builtin.copy:
    src: "{{ pds_src }}/target/release/{{ item.src }}"
    dest: "{{ pds_bin_dir }}/{{ item.dest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: pds, dest: pds }
    - { src: atproto-pds-admin, dest: atproto-pds-admin }
  when: (pds_clone is changed) or (not pds_bin_stat.stat.exists)
  notify: restart pds

- name: Remove the Cargo build tree to reclaim disk space
  # target/ holds all intermediate objects + deps (~6 GB). The binaries are
  # already installed; keeping this would waste most of the CT's rootfs. The
  # src tree (without target/) is kept for reference and revision checks.
  ansible.builtin.file:
    path: "{{ pds_src }}/target"
    state: absent

# --- OAuth signing key (docs/decisions/0011) ----------------------------------
# zai-ops supplies the PDS's OAuth key (PDS_OAUTH_KEYS_JWK_SET) so it is held,
# backed up and rotated like every other signing key. A PDS that has already
# run generated its own and has been publishing it at /oauth/jwks, so that key
# is ADOPTED once, byte-for-byte, never replaced: from the retired
# pds_oauth_jwk_set file where an operator supplied one (the server signs with
# that), else from the server's key store. Only a PDS that has never booted
# gets a newly generated key.
- name: Check for a key set an operator supplied before signing_keys
  # The retired pds_oauth_jwk_set override. Where it exists the server signs
  # with ITS first key (the set overrides the key store), so that is the key
  # to adopt.
  ansible.builtin.stat:
    path: "{{ _zai_secrets_dir }}/pds_oauth_jwk_set"
  delegate_to: localhost
  register: pds_old_jwk_set

- name: Check for the PDS's OAuth key on the control node
  ansible.builtin.stat:
    path: "{{ _zai_secrets_dir }}/pds_oauth.pem"
  delegate_to: localhost
  register: pds_oauth_pem

- name: Adopt the operator-supplied key set
  when:
    - not pds_oauth_pem.stat.exists
    - pds_old_jwk_set.stat.exists
  vars:
    pds_old_keys: "{{ (lookup('ansible.builtin.file', _zai_secrets_dir ~ '/pds_oauth_jwk_set') | from_json)['keys'] }}"
  block:
    - name: Refuse a set this layout cannot hold
      # Current and previous: two keys at most. A third would be published
      # history with nowhere to go, so an operator decides what to keep.
      ansible.builtin.assert:
        that: pds_old_keys | length in [1, 2]
        fail_msg: >-
          {{ _zai_secrets_dir }}/pds_oauth_jwk_set holds {{ pds_old_keys | length }}
          keys; adoption takes one or two (current, then previous).
        quiet: true

    - name: Store its first key as the current key
      ansible.builtin.copy:
        content: "{{ pds_old_keys[0] | jwk_to_pem }}"
        dest: "{{ _zai_secrets_dir }}/pds_oauth.pem"
        mode: "0600"
        force: false
      delegate_to: localhost
      no_log: true

    - name: Store its second key as the previous key
      ansible.builtin.copy:
        content: "{{ pds_old_keys[1] | jwk_to_pem }}"
        dest: "{{ _zai_secrets_dir }}/pds_oauth.previous.pem"
        mode: "0600"
        force: false
      delegate_to: localhost
      no_log: true
      when: pds_old_keys | length == 2

- name: Set the adopted key set aside
  # Renamed, not deleted: it is a secret, and nothing reads it any more.
  # mv -n never overwrites an earlier one.
  ansible.builtin.command:
    argv:
      - mv
      - -n
      - "{{ _zai_secrets_dir }}/pds_oauth_jwk_set"
      - "{{ _zai_secrets_dir }}/pds_oauth_jwk_set.adopted"
  delegate_to: localhost
  when: pds_old_jwk_set.stat.exists

- name: Find the key the server generated for itself
  # The server records its key's store reference in pds_setting
  # (atproto-pds src/keys.rs, load_or_create_pds_signing_key). Followed by
  # reference, never by listing keys/: builds before the persist fix left
  # orphaned keys there. No database or no row means it has never booted.
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, sqlite3, sys
        db = os.path.join(sys.argv[1], "accounts.sqlite")
        if not os.path.exists(db):
            sys.exit(0)
        con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
        try:
            row = con.execute(
                "SELECT value FROM pds_setting WHERE key = 'pds_signing_key_ref'"
            ).fetchone()
        except sqlite3.OperationalError as exc:
            if "no such table" not in str(exc):
                raise
            row = None
        print(row[0] if row else "")
      - "{{ pds_data_dir }}"
  register: pds_own_key_ref
  changed_when: false
  when:
    - not pds_oauth_pem.stat.exists
    - not pds_old_jwk_set.stat.exists

- name: Adopt the server's own key
  when:
    - not pds_oauth_pem.stat.exists
    - not pds_old_jwk_set.stat.exists
    - pds_own_key_ref.stdout | length > 0
  block:
    - name: Refuse a key store this role cannot read
      ansible.builtin.assert:
        that: pds_own_key_ref.stdout is match('file:[0-9a-f]+$')
        fail_msg: "Unexpected key reference {{ pds_own_key_ref.stdout }}; only the file key store is supported."
        quiet: true

    - name: Copy the key off the PDS
      ansible.builtin.slurp:
        src: "{{ pds_data_dir }}/keys/{{ pds_own_key_ref.stdout | regex_replace('^file:', '') }}.key"
      register: pds_own_key
      no_log: true

    - name: Store it as the PDS's OAuth key
      ansible.builtin.copy:
        content: "{{ pds_own_key.content | b64decode | didkey_to_pem }}"
        dest: "{{ _zai_secrets_dir }}/pds_oauth.pem"
        mode: "0600"
        force: false
      delegate_to: localhost
      no_log: true

- name: Generate a key for a PDS that has never booted
  # The lookup writes the file; only the count reaches the output.
  ansible.builtin.set_fact:
    pds_oauth_generated: "{{ query('signing_keys', 'pds_oauth') | length }}"
  when:
    - not pds_oauth_pem.stat.exists
    - not pds_old_jwk_set.stat.exists
    - pds_own_key_ref.stdout | default('') | length == 0

# --- Secret env + unit --------------------------------------------------------
- name: Render the pds secret environment file
  ansible.builtin.template:
    src: pds.env.j2
    dest: "{{ pds_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart pds

- name: Install the pds systemd unit
  ansible.builtin.template:
    src: pds.service.j2
    dest: /etc/systemd/system/pds.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart pds

- name: Ensure pds is started and enabled
  ansible.builtin.systemd:
    name: pds
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending pds restarts before the smoke test
  ansible.builtin.meta: flush_handlers

# --- Smoke tests ---------------------------------------------------------------
# Liveness — /_alive proves the process is serving (the reference-PDS shape).
- name: Wait for pds to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ pds_port }}"
    timeout: 90

- name: Verify pds liveness endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pds_port }}/_alive"
    status_code: [200, 204]
  register: pds_alive
  until: pds_alive is succeeded
  retries: 10
  delay: 3

# Readiness — /xrpc/_health opens the accounts database, so it proves storage
# works, not just that the port is open (the postgres role's pg_isready shape).
- name: Verify pds readiness endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ pds_port }}/xrpc/_health"
    status_code: 200
  register: pds_ready
  until: pds_ready is succeeded
  retries: 10
  delay: 3

# --- Manifest (docs/roles/manifest.md) ----------------------------------------
# After the smoke tests, so a service that failed them never claims a version.
- name: Record the PDS's manifest
  ansible.builtin.include_role:
    name: manifest
  vars:
    manifest_service: pds
    manifest_version: "{{ pds_version }}"
