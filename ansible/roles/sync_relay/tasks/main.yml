---
# Install the SCN Notes service (scn-notes, scn-sync-relay before v0.7.0)
# natively under systemd.
#
# scn-notes is a Rust binary built from source at a pinned tag: no upstream
# publishes a Debian package or a plain-HTTP release tarball for it, and it is
# ours anyway. Same shape as the happyview role (rustup on the CT, build in
# place, install the binary), except that the build tree is kept: a version bump
# then recompiles the relay's own crate rather than every dependency. Runtime
# memory is light; the 2 GB CT sizing is compilation headroom.
#
# ADR-0007 records the design. Since 0.2.0 this is the Phase B relay, which
# verifies Corliss access tokens; the proxy routes it, and the smoke test below
# fails the play unless /health reports auth=corliss.

# --- Provision the role + database on the postgres CT ------------------------------
# Same idiom as happyview/litellm/open-webui: the postgres superuser is peer-only,
# so all psql calls are delegated to the postgres CT. Probe first (psql has no
# IF NOT EXISTS for ROLE or DATABASE), then branch. Password passed via env ($VAR)
# so it never reaches the shell history or the process list; no_log keeps it out of
# the Ansible log.

- name: Check whether the relay's Postgres role exists
  ansible.builtin.command:
    cmd: >-
      su - postgres -c
      "psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname = '{{ sync_relay_db_user }}'\""
  delegate_to: postgres
  register: sync_relay_role_check
  changed_when: false

- name: Create the relay's Postgres role with a generated password
  ansible.builtin.shell:
    cmd: >-
      su -m postgres -c
      "psql -v ON_ERROR_STOP=1
      -c \"CREATE ROLE {{ sync_relay_db_user }} LOGIN PASSWORD '\$SCN_NOTES_DB_PW'\""
  environment:
    SCN_NOTES_DB_PW: "{{ sync_relay_db_password }}"
  delegate_to: postgres
  when: sync_relay_role_check.stdout | trim != "1"
  no_log: true

- name: Ensure the relay's role password matches the generated secret
  # ALTER ROLE always succeeds and only re-hashes — mark unchanged to keep runs quiet.
  ansible.builtin.shell:
    cmd: >-
      su -m postgres -c
      "psql -v ON_ERROR_STOP=1
      -c \"ALTER ROLE {{ sync_relay_db_user }} LOGIN PASSWORD '\$SCN_NOTES_DB_PW'\""
  environment:
    SCN_NOTES_DB_PW: "{{ sync_relay_db_password }}"
  delegate_to: postgres
  when: sync_relay_role_check.stdout | trim == "1"
  no_log: true
  changed_when: false

- name: Check whether the relay's database exists
  ansible.builtin.command:
    cmd: >-
      su - postgres -c
      "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = '{{ sync_relay_db_name }}'\""
  delegate_to: postgres
  register: sync_relay_db_check
  changed_when: false

- name: Create the relay's database owned by its role
  # The schema itself is not created here — the binary runs its own CREATE TABLE
  # IF NOT EXISTS at startup, which is why the role owns the database.
  ansible.builtin.command:
    cmd: >-
      su - postgres -c
      "psql -v ON_ERROR_STOP=1 -c \"CREATE DATABASE {{ sync_relay_db_name }}
      OWNER {{ sync_relay_db_user }}\""
  delegate_to: postgres
  when: sync_relay_db_check.stdout | trim != "1"

# --- Service account + directories ------------------------------------------------

- name: Move the build tree from its pre-v0.7.0 path
  # Before v0.7.0 the software was scn-sync-relay. Moving its tree rather than
  # cloning afresh keeps target/, so the first build under the new name is a
  # few minutes, not a cold 15-30. The running 0.6.0 keeps its open binary
  # until it is stopped below. Idempotent: does nothing once moved.
  ansible.builtin.command:
    cmd: mv /opt/{{ sync_relay_old_name }} {{ sync_relay_home }}
    creates: "{{ sync_relay_home }}"
    removes: /opt/{{ sync_relay_old_name }}

- name: Create the scn-notes system group
  ansible.builtin.group:
    name: "{{ sync_relay_group }}"
    system: true

- name: Create the scn-notes system user
  ansible.builtin.user:
    name: "{{ sync_relay_user }}"
    group: "{{ sync_relay_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ sync_relay_home }}"
    create_home: false

- name: Create the scn-notes home and config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ sync_relay_group }}"
    mode: "{{ item.mode }}"
  loop:
    # home/bin: the installed binary (root-owned, world-readable).
    # config dir: root-owned, holds the 0600 env the daemon reads via EnvironmentFile.
    - { path: "{{ sync_relay_home }}", owner: root, mode: "0755" }
    - { path: "{{ sync_relay_home }}/bin", owner: root, mode: "0755" }
    - { path: "{{ sync_relay_config_dir }}", owner: root, mode: "0750" }

# --- Build dependencies -----------------------------------------------------------

- name: Install system build dependencies
  # libssl-dev + pkg-config are for the TLS stack behind sqlx; the rest is the
  # usual cargo prerequisites.
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - curl
      - git
      - libssl-dev
      - pkg-config
    state: present
    update_cache: true

- name: Check whether the Rust toolchain is installed
  ansible.builtin.command: rustc --version
  register: sync_relay_rust_installed
  changed_when: false
  failed_when: false
  environment:
    PATH: "/root/.cargo/bin:{{ ansible_env.PATH }}"

- name: Install the Rust toolchain via rustup
  # Minimal profile keeps the install lean. The repo commits a
  # rust-toolchain.toml, so rustup installs and uses the pinned toolchain on
  # first build regardless of the channel requested here.
  ansible.builtin.shell:
    cmd: >-
      curl -fsSL https://sh.rustup.rs |
      sh -s -- -y --profile minimal --default-toolchain {{ sync_relay_rust_channel }}
    creates: /root/.cargo/bin/rustc
  when: sync_relay_rust_installed.rc != 0

# --- Clone + build ----------------------------------------------------------------

- name: Check the checked-out scn-notes version
  ansible.builtin.command: git -C "{{ sync_relay_src }}" describe --tags --exact-match
  register: sync_relay_src_version
  changed_when: false
  failed_when: false

- name: Clone scn-notes source at the pinned tag
  # ansible.builtin.git can only check out what origin advertises, so the release
  # tag must be pushed: a local-only tag fails here with "pathspec 'vX.Y.Z' did not
  # match", which reads like a bad version pin. `git ls-remote --tags origin`
  # distinguishes the two; listing tags in a local clone does not.
  ansible.builtin.git:
    repo: "{{ sync_relay_repo_url }}"
    dest: "{{ sync_relay_src }}"
    version: "v{{ sync_relay_version }}"
    depth: 1
    force: true
  register: sync_relay_clone
  when: sync_relay_src_version.stdout | trim != "v" ~ sync_relay_version

- name: Check whether the installed binary exists
  ansible.builtin.stat:
    path: "{{ sync_relay_bin }}"
  register: sync_relay_bin_stat

- name: Check the free disk space under {{ sync_relay_home }}
  ansible.builtin.command: df --output=avail -BG "{{ sync_relay_home }}"
  register: sync_relay_disk
  changed_when: false

- name: Clear the Cargo build tree when the CT is short of disk
  # target/ is kept between builds (below), and it grows as dependency versions
  # change, since cargo never prunes old artifacts. Below the floor it goes, and
  # that one build is a cold one again. The free space is read before building,
  # so a build never starts on a nearly full disk.
  ansible.builtin.file:
    path: "{{ sync_relay_src }}/target"
    state: absent
  when:
    - (sync_relay_clone is changed) or (not sync_relay_bin_stat.stat.exists)
    - (sync_relay_disk.stdout_lines[-1] | trim | regex_replace('G$', '') | int) < sync_relay_min_free_gb

- name: Build scn-notes from source (cargo build --release)
  # Build when the clone just moved to a new version, or the binary isn't installed
  # yet. target/ survives the checkout (it is gitignored, and the clone's
  # `force` only discards changes to tracked files), so cargo rebuilds only
  # what the new tag changed: a bump takes minutes, not the 15-30 a cold build
  # does. No `creates:` guard, since target/ existing says nothing about which
  # version it holds.
  ansible.builtin.command:
    cmd: /root/.cargo/bin/cargo build --release
    chdir: "{{ sync_relay_src }}"
  environment:
    PATH: "/usr/local/bin:/root/.cargo/bin:{{ ansible_env.PATH }}"
    HOME: /root
  when: (sync_relay_clone is changed) or (not sync_relay_bin_stat.stat.exists)
  notify: restart scn-notes

- name: Install the built binary to {{ sync_relay_home }}/bin
  ansible.builtin.copy:
    src: "{{ sync_relay_src }}/target/release/scn-notes"
    dest: "{{ sync_relay_bin }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: (sync_relay_clone is changed) or (not sync_relay_bin_stat.stat.exists)
  notify: restart scn-notes

# --- Secret env + unit ------------------------------------------------------------

- name: Render the scn-notes environment file
  ansible.builtin.template:
    src: scn-notes.env.j2
    dest: "{{ sync_relay_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart scn-notes

- name: Install the scn-notes systemd unit
  ansible.builtin.template:
    src: scn-notes.service.j2
    dest: "/etc/systemd/system/{{ sync_relay_unit }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart scn-notes

# --- Retire the pre-v0.7.0 unit ---------------------------------------------------
# It holds ports 7030 and 7031, so it stops just before scn-notes starts: the
# outage is a restart, not the build. Does nothing once it is gone.

- name: Check for the pre-v0.7.0 unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ sync_relay_old_name }}.service"
  register: sync_relay_old_unit

- name: Stop and disable the pre-v0.7.0 unit
  ansible.builtin.systemd:
    name: "{{ sync_relay_old_name }}"
    state: stopped
    enabled: false
  when: sync_relay_old_unit.stat.exists

- name: Remove the pre-v0.7.0 unit file
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ sync_relay_old_name }}.service"
    state: absent

- name: Ensure scn-notes is started and enabled
  ansible.builtin.systemd:
    name: "{{ sync_relay_unit }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending scn-notes restarts before the smoke test
  ansible.builtin.meta: flush_handlers

- name: Wait for scn-notes to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ sync_relay_port }}"
    timeout: 60

- name: Verify the scn-notes health endpoint responds
  # /health reports liveness and the auth mode without touching Postgres, so this
  # proves the process is up and serving — the storage path is proved by the
  # protocol test in docs/roles/scn_sync_relay.md, not from here.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sync_relay_port }}/health"
    return_content: true
  register: sync_relay_health
  until: sync_relay_health is succeeded
  retries: 10
  delay: 3

- name: Assert the relay is verifying Corliss tokens
  # The body is `ok auth=<mode>`. A relay up with auth=allow-all would accept any
  # connection on a route the proxy now publishes, so that is a failed deploy,
  # not a warning.
  ansible.builtin.assert:
    that:
      - "'auth=corliss' in sync_relay_health.content"
    fail_msg: >-
      scn-notes answered "{{ sync_relay_health.content | trim }}", not
      auth=corliss. Check sync_relay_require_auth and the SCN_NOTES_OIDC_*
      settings in {{ sync_relay_env_file }}.
  when: sync_relay_require_auth | bool

- name: Wait for the MCP listener to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ sync_relay_mcp_port }}"
    timeout: 30

- name: Verify the notes. listener answers
  # The third listener binds separately and refuses to start on a public URL
  # with a path or a trailing slash, so it can fail on its own.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sync_relay_public_port }}/health"
  register: sync_relay_public_health
  until: sync_relay_public_health is succeeded
  retries: 10
  delay: 3

# --- Clear away the pre-v0.7.0 names ----------------------------------------------
# After the smoke test, so a failed upgrade leaves them for a look. Nothing
# reads them now: the env is rendered under the new config dir, and the old
# user owned no files.

- name: Remove the pre-v0.7.0 config directory
  ansible.builtin.file:
    path: "/etc/{{ sync_relay_old_name }}"
    state: absent

- name: Remove the pre-v0.7.0 system user
  ansible.builtin.user:
    name: "{{ sync_relay_old_name }}"
    state: absent

- name: Remove the pre-v0.7.0 system group
  ansible.builtin.group:
    name: "{{ sync_relay_old_name }}"
    state: absent

# --- Manifest (docs/roles/manifest.md) ----------------------------------------
# After the smoke test, so a service that failed it never claims a version.
- name: Record the sync relay's manifest
  ansible.builtin.include_role:
    name: manifest
  vars:
    manifest_version: "{{ sync_relay_version }}"
