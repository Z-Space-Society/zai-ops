---
# Install and configure Garage as the cluster's S3-compatible object store.
# Reached only over the internal network (vmbr1); the backup job on the control
# node writes its restic repo here.

- name: Create the garage system group
  ansible.builtin.group:
    name: garage
    system: true

- name: Create the garage system user
  ansible.builtin.user:
    name: garage
    group: garage
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/garage
    create_home: false

- name: Create the metadata and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: garage
    group: garage
    mode: "0700"
  loop:
    - /var/lib/garage
    - "{{ garage_metadata_dir }}"
    - "{{ garage_data_dir }}"

# Static single binary — no apt package on Debian. get_url is idempotent on the
# dest; the optional checksum makes a tampered/partial download fail the run.
- name: Install the garage binary
  ansible.builtin.get_url:
    url: "{{ garage_binary_url }}"
    dest: /usr/local/bin/garage
    mode: "0755"
    owner: root
    group: root
    checksum: "{{ ('sha256:' + garage_binary_sha256) if garage_binary_sha256 else omit }}"
  notify: restart garage

# Config carries the rpc_secret + admin_token. Garage 2.x refuses to start if the
# file is readable by group or others, so it's 0600 owned by the garage user
# (the daemon reads it as itself; root/Ansible still manage it freely).
- name: Deploy the garage configuration
  ansible.builtin.template:
    src: garage.toml.j2
    dest: /etc/garage.toml
    owner: garage
    group: garage
    mode: "0600"
  notify: restart garage

- name: Install the garage systemd unit
  ansible.builtin.template:
    src: garage.service.j2
    dest: /etc/systemd/system/garage.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart garage

- name: Ensure garage is started and enabled
  ansible.builtin.systemd:
    name: garage
    state: started
    enabled: true
    daemon_reload: true

# Flush now so the daemon is actually up (with the latest config) before we run
# the one-time cluster init below, rather than at the end of the play.
- name: Apply pending garage restarts before cluster init
  ansible.builtin.meta: flush_handlers

- name: Wait for the S3 API to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 3900
    timeout: 60

# One-time cluster bring-up: assign the storage layout, import the vault-pinned
# access key, create the bucket, and grant the key. Idempotent via the sentinel
# the script touches on success (`creates:`), so re-runs are no-ops and the
# credentials stay stable across rebuilds (restic repo survives).
- name: Install the cluster-init script
  ansible.builtin.template:
    src: garage-init.sh.j2
    dest: /usr/local/bin/garage-init.sh
    owner: root
    group: root
    mode: "0700"

- name: Initialise the garage cluster (layout, key, bucket)
  ansible.builtin.command:
    cmd: /usr/local/bin/garage-init.sh
    creates: /var/lib/garage/.zai-initialized
  environment:
    ZAI_OS_ACCESS_KEY: "{{ object_store_access_key }}"
    ZAI_OS_SECRET_KEY: "{{ object_store_secret_key }}"

# --- Service manifests (docs/decisions/0009) ---------------------------------
# A second bucket holding one JSON manifest per service, written by each service
# play and read by Corliss's /systems/. Deliberately NOT in garage-init.sh: that
# script is gated by a one-time sentinel, so anything added to it never runs on a
# cluster that is already initialised. These tasks converge on every run instead.
#
# Two keys, neither of which can reach zai-backups: the writer lives only on the
# control node (the manifest role), the reader only in Corliss's env. The backup
# key stays out of service plays entirely.
- name: Look up the manifest access keys
  ansible.builtin.command:
    cmd: "garage key info {{ item.name }}"
  loop: "{{ _manifest_keys }}"
  loop_control:
    label: "{{ item.name }}"
  register: manifest_key_info
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true

# Imported from the generated secrets (not Garage-minted) so a rebuild restores
# the same credentials and Corliss's env keeps working without a re-render.
- name: Import the manifest access keys
  ansible.builtin.command:
    cmd: "garage key import --yes -n {{ item.item.name }} {{ item.item.access }} {{ item.item.secret }}"
  loop: "{{ manifest_key_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0
  no_log: true

- name: Look up the manifest bucket
  ansible.builtin.command:
    cmd: "garage bucket info {{ manifest_bucket }}"
  register: manifest_bucket_info
  failed_when: false
  changed_when: false
  check_mode: false

- name: Create the manifest bucket
  ansible.builtin.command:
    cmd: "garage bucket create {{ manifest_bucket }}"
  when: manifest_bucket_info.rc != 0

# Grants are declarative in Garage: re-allowing an existing permission is a
# no-op, so this converges rather than reporting a change every run. The writer
# needs --read too: s3_object checks for the existing object before its PUT.
- name: Grant the manifest keys on the manifest bucket
  ansible.builtin.command:
    cmd: "garage bucket allow {{ item.grant }} {{ manifest_bucket }} --key {{ item.name }}"
  loop: "{{ _manifest_keys }}"
  loop_control:
    label: "{{ item.name }} {{ item.grant }}"
  changed_when: false

- name: Record Garage's manifest
  ansible.builtin.include_role:
    name: manifest
  vars:
    manifest_service: garage
    manifest_version: "{{ garage_version }}"
