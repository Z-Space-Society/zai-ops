---
# Record the membership registry's per-cluster identity.
#
#   ansible-playbook set-registry.yml -e "key=client_key" -e "value=hvc_xxxxx"
#
# (`scn-config`'s Cluster Settings entry, and `scn-config nonint set-registry
# <key> <value>`, are the front end; this playbook stays the authority.)
#
# The variable names it writes (console_client_key, scn_service_did) are older
# than the playbook's own name and stay as they are: live clusters already hold
# them, so renaming is a migration. See docs/roles/corliss.md, Notes.
#
# Why a setter and not group_vars: both are this-cluster IDENTITY (which
# HappyView client, which registry DID), the same category as cluster_domain and
# the CTID assignments, so they go in the git-ignored runtime inventory and the
# committed tree stays generic (ADR-0001).
#
# Why a setter and not the vault: neither is a secret. The DID is public
# information and the client key is published at a public URL and bound to an
# origin, which is what carries the security, not its secrecy. Putting a
# non-secret in the vault is the mistake this repo's conventions call out by
# name.
#
# Unlike set-domain.yml this takes a KEY as well as a value, because there are
# two of them and two near-identical playbooks would be worse. The allowlist
# is the safety rail: it stops a typo'd key from being merged into the runtime
# inventory as a new, silently-ignored variable — the failure mode a free-form
# setter would have.
#
# Read-modify-write the WHOLE structure and re-dump (never line-append): that
# preserves cluster_domain, every service's CTID assignment AND the
# inference-node roster that share this file, instead of corrupting it.

- name: Record the membership registry's per-cluster identity
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    runtime_inventory: "{{ playbook_dir }}/inventory/local.yml"
    # Short operator-facing key -> the inventory variable it sets. Both are
    # read by corliss (roles/corliss/defaults/main.yml, which is where their
    # blank blueprint defaults live now).
    #
    # `registry_space_uri` was a third key and is gone: it configured the
    # console's service-identity panel only, and the registry's own Lua carries
    # its copy in the HappyView script env, so nothing in this repo reads it.
    registry_keys:
      client_key: console_client_key
      service_did: scn_service_did
    # The same shape scn-config checks before it gets here.
    did_regex: '^did:(plc:[a-z2-7]{24}|web:[A-Za-z0-9.%:-]+)$'
  tasks:
    - name: Require key and value
      ansible.builtin.assert:
        that:
          - key is defined and (key | string | length) > 0
          - value is defined
        fail_msg: >-
          Pass a key and a value, e.g.
          -e "key=client_key" -e "value=hvc_xxxxx"

    - name: Validate the key against the allowlist
      ansible.builtin.assert:
        that: key in registry_keys
        fail_msg: >-
          '{{ key }}' is not a registry setting — expected one of:
          {{ registry_keys.keys() | join(', ') }}

    # A mistyped DID would be recorded and then read as an empty roster, with
    # nothing anywhere saying why. Empty is allowed: it records "none". The
    # client key has no published format to hold it to.
    - name: Require a service DID to look like one
      ansible.builtin.assert:
        that: (value | string | length) == 0 or (value | string) is match(did_regex)
        fail_msg: >-
          '{{ value }}' is not a DID. Expected did:plc:… or did:web:…, or an
          empty value to record none.
      when: key == 'service_did'

    - name: Resolve the inventory variable name
      ansible.builtin.set_fact:
        registry_var: "{{ registry_keys[key] }}"

    # errors='ignore' → empty string when the file doesn't exist yet; 'or {}'
    # turns that (and an empty/whitespace file) into an empty mapping to merge into.
    - name: Load the existing runtime inventory (empty if absent)
      ansible.builtin.set_fact:
        runtime_data: "{{ (lookup('file', runtime_inventory, errors='ignore') | from_yaml) or {} }}"

    # Idempotent no-op: setting the value that's already recorded exits 0 cleanly.
    - name: Detect an unchanged (no-op) value
      ansible.builtin.set_fact:
        is_noop: >-
          {{ (runtime_data.get('all', {}).get('vars', {}).get(registry_var) | default(none))
             == (value | string) }}

    - name: Report the no-op and finish
      ansible.builtin.debug:
        msg: "{{ registry_var }} is already set to that value — nothing to do."
      when: is_noop | bool

    # Read-modify-write: merge ONLY this one variable into the whole structure,
    # recursively, so the domain, every CTID assignment and the inference-node
    # roster survive.
    - name: Merge the setting into the runtime structure
      ansible.builtin.set_fact:
        merged_inventory: >-
          {{
            runtime_data
            | combine({'all': {'vars': {registry_var: value | string}}}, recursive=True)
          }}
      when: not (is_noop | bool)

    - name: Write the runtime inventory
      ansible.builtin.copy:
        dest: "{{ runtime_inventory }}"
        content: "{{ merged_inventory | to_nice_yaml(indent=2) }}"
        mode: "0644"
      when: not (is_noop | bool)

    - name: Report
      ansible.builtin.debug:
        msg: "{{ registry_var }} recorded in {{ runtime_inventory }}."
      when: not (is_noop | bool)
