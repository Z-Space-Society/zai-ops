---
# Non-secret cluster-wide vars (the encrypted secrets live in vault.yml beside
# this file). These are committed BLUEPRINT defaults — generic, no this-cluster
# identity.
#
# proxmox_node_name is deliberately NOT here: it's the host you flashed, not
# committed identity — the same category as the CTID assignments and the domain
# (ADR-0001). bootstrap.sh records it from `hostname` into the git-ignored runtime
# inventory (inventory/local.yml); correct it with `scn-config` (Cluster Settings).
# Provision targets it as the `node:` of every API call; a stale value makes
# pveproxy proxy every create to a phantom node and time out (HTTP 595).

# cluster_domain — the cluster's public base domain (e.g. zai.cascadia.design),
# consumed by Caddy proxy routes like api.{{ cluster_domain }}. Deliberately NOT
# set here: like the service CTIDs, it's per-cluster runtime data, not committed
# identity. Set it with `scn-config nonint set-domain <domain>`, which records it in the
# git-ignored runtime inventory (inventory/local.yml) under `all: vars:`. Leaving
# it out of the committed tree keeps the blueprint generic (ADR-0001).

# CTIDs the assign action (ansible/assign.yml) refuses to hand out — the safety
# rail against stomping live or externally-managed containers. Default is just
# the control node's pinned target (100). On a BROWNFIELD host, widen this to
# every live CTID before assigning anything, e.g. on yvette:
#   reserved_ctids: [100, 101, 102, 103, 104, 199]
# (100 = eventual control-node target, 101-104 = live services, 199 = the current
# control node). With these set, no assign or provision run can target them, and scn-config
# stops proposing any blueprint default_ctid that falls in the list.
reserved_ctids: [100]

# Storage for service-CT root filesystems. Combined with each CT's ct_disk size
# into the `disk: <storage>:<size>` form the proxmox module needs — a bare size
# with a separate `storage:` renders a pathless rootfs that PVE rejects under
# token auth ("Only root can pass arbitrary filesystem paths").
ct_rootfs_storage: local-lvm

# --- Auto-generated runtime secrets (no manual step) -----------------------
# Generated on the control node the first time they're used and persisted under
# /root/.zai-secrets (root-only); re-runs reuse the same values, so the
# object-store key and restic repo stay stable. The expressions below are
# *recipes*, not secrets — the material lives only on CT 100 — so they belong
# here, not in the vault. Same posture as /root/.vault_pass: host root is the
# trust boundary.
#
# The `password` lookup runs on the control node regardless of a play's target,
# so the object_store play (CT 105) and the backup play (CT 100) both resolve to
# the *same* values. `chars=digits,abcdef` gives lowercase hex.
#
# These are part of the control node's restored state: a fresh CT 100 would
# generate *new* values, so restore /root/.zai-secrets (it's in the backup)
# before re-running Ansible. See docs/roles/backup.md.
_zai_secrets_dir: /root/.zai-secrets
garage_rpc_secret: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/garage_rpc_secret chars=digits,abcdef length=64') }}"
garage_admin_token: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/garage_admin_token chars=digits,abcdef length=64') }}"
object_store_access_key: "GK{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/object_store_access_key chars=digits,abcdef length=24') }}"
object_store_secret_key: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/object_store_secret_key chars=digits,abcdef length=64') }}"
restic_repo_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/restic_repo_password chars=digits,abcdef length=64') }}"

# Service manifests (docs/decisions/0009): one JSON object per service in its own
# Garage bucket, written at the end of each service play and read by Corliss's
# /systems/. Two scoped keys, neither with any grant on zai-backups: the writer
# is used only by the manifest role on the control node, the reader is rendered
# only into Corliss's env. Same generate-once posture as the backup key above.
# The bucket name lives here, not in a role default, because three roles read it
# (object_store creates it, manifest writes to it, corliss reads from it).
manifest_bucket: "zai-manifests"
manifest_writer_access_key: "GK{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/manifest_writer_access_key chars=digits,abcdef length=24') }}"
manifest_writer_secret_key: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/manifest_writer_secret_key chars=digits,abcdef length=64') }}"
manifest_reader_access_key: "GK{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/manifest_reader_access_key chars=digits,abcdef length=24') }}"
manifest_reader_secret_key: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/manifest_reader_secret_key chars=digits,abcdef length=64') }}"

# The zai-ops revision a manifest records: the control node's own checkout
# (/opt/zai-ops on CT 100), read at the moment the play runs. --dirty is the
# point, not decoration: a "-dirty" suffix means the blueprint was hand-edited on
# CT 100, which breaks "the artifact is the repo", and /systems/ should say so.
# --always keeps it a value (a bare sha) even on a clone with no tags fetched.
zai_ops_revision: "{{ lookup('ansible.builtin.pipe', 'git -C ' ~ playbook_dir ~ ' describe --tags --always --dirty') }}"

# LiteLLM proxy secrets. master_key is the proxy's admin/root API key (the `sk-…`
# clients and the admin UI authenticate with); db_password is the password for the
# `litellm` Postgres role the litellm role creates on the postgres CT. Both resolve
# on the control node, so the litellm play (which renders the env file) and the
# role-provisioning task (which sets the PG password) see identical values, and
# they stay stable across rebuilds. Hex chars keep them clear of any character that
# would need percent-encoding inside the DATABASE_URL.
litellm_master_key: "sk-{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/litellm_master_key chars=digits,abcdef length=48') }}"
litellm_db_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/litellm_db_password chars=digits,abcdef length=48') }}"

# salt_key encrypts every provider credential STORE_MODEL_IN_DB writes to Postgres.
# DISTINCT from master_key on purpose: LiteLLM falls back to the master key when this
# is unset, which couples credential encryption to a key that is otherwise rotatable
# — and the salt key CANNOT be changed once a model is stored (no recovery short of
# dropping the encrypted rows). A dedicated, stable salt key keeps the two concerns
# independent. Generated and pinned like master_key so it never silently changes.
litellm_salt_key: "sk-{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/litellm_salt_key chars=digits,abcdef length=48') }}"

# OpenWebUI secrets, same posture/pattern as the litellm pair above (resolved on the
# control node, persisted under /root/.zai-secrets, stable across rebuilds). db_password
# is the password for the `openwebui` Postgres role the open-webui role creates on the
# postgres CT; secret_key signs OpenWebUI's session JWTs — set explicitly so logins
# survive a rebuild (unset, OpenWebUI writes a random one into DATA_DIR that a fresh CT
# would regenerate). Hex chars keep db_password clear of percent-encoding in DATABASE_URL.
openwebui_db_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/openwebui_db_password chars=digits,abcdef length=48') }}"
openwebui_secret_key: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/openwebui_secret_key chars=digits,abcdef length=64') }}"

# HappyView secrets, same posture as the litellm/openwebui pairs above. db_password
# is the password for the `happyview` Postgres role; session_secret signs session
# cookies (64+ chars, must be stable across rebuilds — changing it invalidates all
# active sessions). token_encryption_key is a base64-encoded 32-byte key for
# encrypting OAuth tokens at rest; it CANNOT change once tokens are stored (no
# migration path — all connected accounts would need to re-authenticate). The
# `pipe` lookup generates it once via openssl and caches it in the secrets dir.
happyview_db_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/happyview_db_password chars=digits,abcdef length=48') }}"
happyview_session_secret: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/happyview_session_secret chars=ascii_letters,digits length=64') }}"
happyview_token_encryption_key: "{{ lookup('ansible.builtin.pipe', 'test -f ' ~ _zai_secrets_dir ~ '/happyview_token_key && cat ' ~ _zai_secrets_dir ~ '/happyview_token_key || (openssl rand -base64 32 | tr -d \"\\n\" | tee ' ~ _zai_secrets_dir ~ '/happyview_token_key)') }}"

# Redis auth. Same generate-once-and-persist posture as everything above, and
# read by TWO roles: the `redis` role renders it as requirepass, and the
# open-webui role builds it into REDIS_URL — one value resolved on the control
# node, so the two can never disagree the way a per-role default could. Hex, so
# it needs no percent-encoding inside that URL.
#
# Named `redis_auth_password` rather than `redis_password` because the role
# default of that name wraps this one (same idiom as openwebui_oidc_client_secret
# wrapping corliss_oidc_client_secret); a role default and a group_var sharing a
# name would make which one wins depend on precedence rather than on intent.
redis_auth_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/redis_password chars=digits,abcdef length=48') }}"

# corliss secrets, same posture as the litellm/openwebui/happyview pairs above.
# db_password is the password for the `corliss` Postgres role; secret_key is
# Django's SECRET_KEY (signs sessions/CSRF — set explicitly so logins survive a
# rebuild); oidc_client_secret is the shared secret corliss and Open WebUI's
# OIDC client both need to agree on.
corliss_db_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/corliss_db_password chars=digits,abcdef length=48') }}"
corliss_secret_key: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/corliss_secret_key chars=ascii_letters,digits length=64') }}"
corliss_oidc_client_secret: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/corliss_oidc_client_secret chars=digits,abcdef length=48') }}"

# Bearer token the SCN registry (HappyView Lua) presents when it POSTs a grant
# or revocation to corliss's /membership/events. Same generate-once posture as
# the secrets above, with one difference worth knowing: this is the first
# secret here that has to travel OUTWARD. The identical value must be set as
# CORLISS_PUSH_TOKEN in the scn-member-registry checkout's .env on whichever
# machine runs `npm run deploy`, because that script — not Ansible — is what
# installs it as a HappyView script variable. Read it off the control node
# with:
#
#     cat /root/.zai-secrets/corliss_membership_push_token
#
# Corliss refuses every push with a 503 while this is unset on its side, so a
# half-configured pair fails closed and loudly rather than silently accepting
# unauthenticated events.
corliss_membership_push_token: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/corliss_membership_push_token chars=ascii_letters,digits length=48') }}"

# Token corliss presents to the registry when it reads membership back OUT —
# the `syncMembers` service door, which reconciliation uses to rebuild the cache
# from scratch. The push above cannot do that: a rebuilt corliss has witnessed
# no pushes, and those events already happened.
#
# Travels OUTWARD like the push token, and to the same place: set the identical
# value as RECONCILE_TOKEN in the scn-member-registry checkout's .env before
# `npm run deploy`, since that script installs it as a HappyView script
# variable.
#
#     cat /root/.zai-secrets/corliss_membership_registry_token
#
# Deliberately a SEPARATE secret from the push token, not a reuse of it: this
# one *reads* (a leak exposes the member roll), that one only asserts a cache
# update. Separate secrets rotate independently, and widening one door cannot
# widen the other. Both sides fail closed while unset — the Lua refuses every
# call and corliss shows reconciliation as unconfigured.
corliss_membership_registry_token: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/corliss_membership_registry_token chars=ascii_letters,digits length=48') }}"

# Password for the provision-time break-glass local admin (username `admin`,
# /admin/login/ only — no ATProto identity). DR-critical: it's the only way in
# if ATProto/OIDC login is ever broken, on par with the two signing keys below.
# Same generate-once-and-persist posture as every secret above — already rides
# the existing Tier-1 control-node backup of /root/.zai-secrets, no separate
# escrow path needed.
corliss_admin_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/corliss_admin_password chars=ascii_letters,digits length=32') }}"

# Signing keys (docs/decisions/0011). Every asymmetric key a service signs
# OAuth or OIDC material with is a PKCS8 PEM under /root/.zai-secrets, read
# and, when absent, generated by the `signing_keys` lookup
# (ansible/lookup_plugins/signing_keys.py). `query` returns a list: the
# current key, then the previous one while `scn-config` is rotating it out.
# Services that take JWKs render the list with the `private_jwk` filter. A new
# service that needs a key follows docs/adding-a-service.md, "A signing key".
#
# corliss's two keys are DR-critical. Losing ATPROTO_EC breaks every member's
# atproto session (each must sign in again); losing OIDC_RSA invalidates every
# id_token and access token in flight. Same files as when an openssl `pipe`
# lookup generated them, read with the same whitespace stripping, so moving to
# the lookup changed no byte on the Corliss CT.
corliss_atproto_ec_keys: "{{ query('signing_keys', 'corliss_atproto_ec') }}"
corliss_oidc_rsa_keys: "{{ query('signing_keys', 'corliss_oidc_rsa', type='rsa') }}"

# scn-chat's atproto OAuth client key, rendered into OAUTH_PRIVATE_KEYS as a
# JSON array of private JWKs. @atproto/oauth-client starts each session on the
# first key and refreshes it with the kid it recorded, so a rotation keeps
# existing sessions working until the previous key is retired.
scn_chat_oauth_keys: "{{ query('signing_keys', 'scn_chat_oauth') }}"

# Every signing key `scn-config rotate-key` can rotate: the service that uses
# it (provisioned after a rotate or a retire), its type, and what retiring the
# previous key costs. A new service that takes a key adds its entry here.
signing_key_registry:
  corliss_atproto_ec:
    service: corliss
    type: ec
    retire: >-
      Ends every member's atproto session still on the old key; each signs in
      again, and an admin re-authenticates the service account from /manage/.
  corliss_oidc_rsa:
    service: corliss
    type: rsa
    retire: >-
      Safe an hour after rotating, the longest an id_token lives. Sooner, a
      relying party may refuse a token it is still holding.
  pds_oauth:
    service: pds
    type: ec
    retire: Safe at any time; it signs only short-lived delegated sign-in assertions.
  scn_chat_oauth:
    service: scn-chat
    type: ec
    retire: >-
      Ends every member's scn-chat session still on the old key; those members
      sign in again.

# scn-chat's SECRET_KEY, the app's symmetric secret (it encrypts stored API
# keys). Generate-once and persisted like HappyView's; it rides the Tier-1
# backup of /root/.zai-secrets. Not a signing key: its OAuth key is
# scn_chat_oauth_keys above (ADR-0011).
scn_chat_secret_key: "{{ lookup('ansible.builtin.pipe', 'test -f ' ~ _zai_secrets_dir ~ '/scn_chat_secret_key && cat ' ~ _zai_secrets_dir ~ '/scn_chat_secret_key || (openssl rand -base64 32 | tr -d \"\\n\" | tee ' ~ _zai_secrets_dir ~ '/scn_chat_secret_key)') }}"

# The sync relay's Postgres password, same generate-once-and-persist posture as
# the pairs above. Hex, so it needs no percent-encoding inside the
# SCN_SYNC_RELAY_DATABASE_URL the role builds from it.
#
# Named sync_relay_db_password to match the role default that consumes it
# directly — unlike the redis/openwebui pairs, nothing wraps this one under a
# second name, because only the one role reads it.
sync_relay_db_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/sync_relay_db_password chars=digits,abcdef length=48') }}"

# The credential Corliss presents on the relay's /internal/vaults, to list a
# member's vaults and create one. Here rather than in either role because both
# render it: Corliss as SYNC_RELAY_SERVICE_TOKEN, the relay as
# SCN_SYNC_RELAY_SERVICE_TOKEN, and one value resolved on the control node is
# what keeps them from disagreeing. Not DR-critical: losing it costs a
# regenerate and a replay of both roles, and no stored data depends on it.
sync_relay_service_token: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/sync_relay_service_token chars=ascii_letters,digits length=48') }}"

# The relay's two public hostnames: the sync websocket and the MCP service.
# Defined once and read by three roles. The proxy routes them, Corliss issues
# access tokens whose `aud` is https://<host> (OIDC_RESOURCES), and the relay
# refuses any token whose `aud` is not that exact string (SYNC_AUDIENCE,
# MCP_AUDIENCE). Spelled in three places, the audiences would drift and every
# token would fail with a bare 401. MCP_AUDIENCE is also the only Host the MCP
# service answers, so it must be lowercase with no trailing slash.
sync_relay_sync_host: "sync.{{ cluster_domain }}"
sync_relay_mcp_host: "mcp.{{ cluster_domain }}"

# pds secrets — the in-house PDS (atproto-pds) that hosts the cluster's atproto
# accounts. The JWT secret and admin password follow the generate-once-and-persist
# posture of every pair above; the OAuth JWK set override and the SMTP URL
# below are provisioned by an operator instead, and are optional. All ride the existing
# Tier-1 control-node backup of /root/.zai-secrets.
#
# PDS_JWT_SECRET signs JWTs the server issues; PDS_ADMIN_PASSWORD guards the
# /admin dashboard (the break-glass staff door when delegated-admin auth is
# down); the OAuth JWK set signs the OAuth provider's tokens; and
# PDS_PLC_ROTATION_KEY_PRIVATE is the operator's recovery key for every identity
# this server issues — losing it is losing the accounts. DR-critical, all four.
#
# Key generation (verified 2026-09-23 against atproto-crates head + the
# operator guide + workspace source):
#   * PDS_JWT_SECRET / PDS_ADMIN_PASSWORD: recipes below (openssl-grade random),
#     generated once and persisted under /root/.zai-secrets.
#   * PDS_OAUTH_KEYS_JWK_SET: the PDS's OAuth signing key, `pds_oauth_keys`
#     below, always supplied by us. On a PDS that already ran, the pds role
#     adopts the key it signs with now (from the retired pds_oauth_jwk_set
#     file where one exists, else from its key store), so the published key
#     does not change; on a fresh one it is generated here before first boot. Format `{"keys": [<private jwk>, ...]}`;
#     the first entry signs, the rest are published for verification only.
#   * PDS_PLC_ROTATION_KEY_PRIVATE: the operator's recovery key for every
#     identity this server issues — "the private did:key a key generator
#     prints" (P-256 z42t… / K-256 z3vL…; a public key or other curve is refused
#     at boot). OPTIONAL at boot (the server generates per-account signing
#     keys); REQUIRED when we must be able to update a hosted identity's DID
#     document ourselves (the SCN DID migration).
# The role's env template emits the rotation key only when non-empty (a
# missing file reads as empty), so the role runs fine without it.
pds_jwt_secret: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/pds_jwt_secret chars=digits,abcdef length=64') }}"
pds_admin_password: "{{ lookup('ansible.builtin.password', _zai_secrets_dir ~ '/pds_admin_password chars=ascii_letters,digits length=32') }}"
# The PDS's OAuth key. It signs only the client assertion the PDS sends during
# delegated sign-in; access and refresh tokens are HS256 over pds_jwt_secret,
# so rotating it signs nobody out. generate=false: the pds role creates the
# file (adopting the server's own key when it has one), and a missing file
# fails the play rather than silently minting a key that differs from the one
# the server has been publishing.
pds_oauth_keys: "{{ query('signing_keys', 'pds_oauth', generate=false) }}"
# pds_plc_rotation_key_private: unset for now — wire before the SCN DID migration

# Outbound mail relay. One SMTP URL per cluster, credentials included, e.g.
# smtps://user:password@smtp.example.com:465. Which relay a cluster uses is
# that cluster's choice, so no provider is named here: `scn-config` (Set SMTP,
# or `nonint set-smtp`) writes the whole URL to /root/.zai-secrets/smtp_url
# through set-smtp.yml (it carries a password, so it is a secret and not
# runtime inventory). A missing file reads as empty, and every
# consumer then leaves mail off. The only consumer today is the PDS, which
# enables delivery when both this and pds_email_from_address are set.
smtp_url: "{{ lookup('ansible.builtin.file', _zai_secrets_dir ~ '/smtp_url', errors='ignore') | default('', true) }}"
pds_email_smtp_url: "{{ smtp_url }}"

# scn-chat's admin API key, for its cron timer (roles/scn_chat, docs/roles/
# scn_chat.md). It can't be generated here: scn-chat mints it in its own Admin >
# API keys after first sign-in, and `scn-config` (Cluster Settings, or `nonint
# set-scn-chat-key`) writes it to /root/.zai-secrets/scn_chat_admin_key through
# set-scn-chat-key.yml. It holds admin over scn-chat, so it is a secret and not
# runtime inventory. A missing file reads as empty and the timer stays off.
scn_chat_admin_key: "{{ lookup('ansible.builtin.file', _zai_secrets_dir ~ '/scn_chat_admin_key', errors='ignore') | default('', true) }}"
