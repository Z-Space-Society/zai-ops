---
# corliss — the cluster's ATProto→OIDC login bridge. A Django app run natively
# under systemd (gunicorn), Postgres-backed, fronted by Caddy — same shape as
# litellm/open-webui, including how it's installed: the source is cloned from
# Z-Space-Society/Corliss at the pinned corliss_version. Updating the app is a
# tag bump in defaults/main.yml plus a replay of this role (ADR-0006).

# --- Provision the corliss role + database on the postgres CT ---------------
# Identical delegated `su - postgres -c psql` idiom to litellm/open-webui/
# happyview — the postgres CT's superuser is reachable only via local peer auth
# on that CT, never over TCP. Probe-then-branch (psql has no CREATE ... IF NOT
# EXISTS); no_log on the password-bearing tasks.

- name: Check whether the corliss Postgres role exists
  ansible.builtin.command:
    cmd: >-
      su - postgres -c
      "psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname = '{{ corliss_db_user }}'\""
  delegate_to: postgres
  register: corliss_role_check
  changed_when: false

- name: Create the corliss Postgres role with a generated password
  ansible.builtin.shell:
    cmd: >-
      su -m postgres -c
      "psql -v ON_ERROR_STOP=1
      -c \"CREATE ROLE {{ corliss_db_user }} LOGIN PASSWORD '\$CORLISS_DB_PW'\""
  environment:
    CORLISS_DB_PW: "{{ corliss_db_password }}"
  delegate_to: postgres
  when: corliss_role_check.stdout | trim != "1"
  no_log: true

- name: Ensure the corliss role password matches the generated secret
  # ALTER ROLE always succeeds and only re-hashes, so it carries no useful
  # changed signal — mark it unchanged to keep runs quiet (covers a rotated secret).
  ansible.builtin.shell:
    cmd: >-
      su -m postgres -c
      "psql -v ON_ERROR_STOP=1
      -c \"ALTER ROLE {{ corliss_db_user }} LOGIN PASSWORD '\$CORLISS_DB_PW'\""
  environment:
    CORLISS_DB_PW: "{{ corliss_db_password }}"
  delegate_to: postgres
  when: corliss_role_check.stdout | trim == "1"
  no_log: true
  changed_when: false

- name: Check whether the corliss database exists
  ansible.builtin.command:
    cmd: >-
      su - postgres -c
      "psql -tAc \"SELECT 1 FROM pg_database WHERE datname = '{{ corliss_db_name }}'\""
  delegate_to: postgres
  register: corliss_db_check
  changed_when: false

- name: Create the corliss database owned by the corliss role
  ansible.builtin.command:
    cmd: >-
      su - postgres -c
      "psql -v ON_ERROR_STOP=1 -c \"CREATE DATABASE {{ corliss_db_name }}
      OWNER {{ corliss_db_user }}\""
  delegate_to: postgres
  when: corliss_db_check.stdout | trim != "1"

# --- Service account + directories ------------------------------------------

- name: Create the corliss system group
  ansible.builtin.group:
    name: "{{ corliss_group }}"
    system: true

- name: Create the corliss system user
  ansible.builtin.user:
    name: "{{ corliss_user }}"
    group: "{{ corliss_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ corliss_home }}"
    create_home: false

- name: Create the corliss home, src and config directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ corliss_group }}"
    mode: "{{ item.mode }}"
  loop:
    # home: owned by the daemon (venv + cloned source live here).
    # config dir: root-owned, group-readable so the daemon reads the env file's
    # sibling keys/ dir directly (the env file itself stays root:root — see below).
    - { path: "{{ corliss_home }}", owner: "{{ corliss_user }}", mode: "0755" }
    - { path: "{{ corliss_src }}", owner: "{{ corliss_user }}", mode: "0755" }
    - { path: "{{ corliss_config_dir }}", owner: root, mode: "0750" }
    - { path: "{{ corliss_keys_dir }}", owner: root, mode: "0750" }

# --- Clone the app source at its pinned ref ----------------------------------
# The app is its own repo now (ADR-0006), so this is an ordinary pinned-version
# install like every other role's — not the rsync-off-the-control-node special
# case it used to be. Public repo over the host's NAT: no credentials, nothing
# to put in the vault.
#
# force: true discards any drift on the CT (a hand-edit, a half-applied run)
# so the checkout is always exactly corliss_version — the same guarantee
# rsync's delete=true used to give.

- name: Ensure git is present for the app checkout
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: true

- name: Trust the corliss checkout for root's git operations
  # git runs as root here, but the tree is owned by the corliss service user
  # (pre-created below /opt/corliss, and recursively chowned at the end of this
  # role). Git refuses to touch a repo whose worktree belongs to someone else —
  # "detected dubious ownership" — and because it bails BEFORE reading
  # .git/config, the failure surfaces as the thoroughly misleading
  # "'origin' does not appear to be a git repository". Marking the path safe is
  # git's documented escape hatch for exactly this case (root maintaining a
  # service user's checkout). --replace-all, not --add: the latter appends a
  # duplicate entry on every run.
  ansible.builtin.command:
    cmd: git config --system --replace-all safe.directory {{ corliss_src }}
  changed_when: false

- name: Clone the Corliss app source at the pinned ref
  ansible.builtin.git:
    repo: "{{ corliss_repo_url }}"
    dest: "{{ corliss_src }}"
    version: "{{ corliss_version }}"
    force: true
  notify: restart corliss

# --- uv + a managed CPython (the app pins 3.14 in its committed .python-version;
# Debian 13 ships 3.13, so uv fetches its own — exactly like open-webui) --------

- name: Ensure CA certificates are present for the uv + package downloads
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true

- name: Check the installed uv version
  ansible.builtin.command: "{{ corliss_uv_bin }} --version"
  register: corliss_uv_installed
  changed_when: false
  failed_when: false

# Install uv reproducibly from the pinned, checksummed release tarball — NOT a
# `curl | sh` of a moving installer. Same idiom as the open-webui role.
- name: Install the pinned uv binary
  when: corliss_uv_version not in (corliss_uv_installed.stdout | default(''))
  block:
    # Retried: this fetch crosses the host's NAT to GitHub's release CDN, which
    # intermittently drops the connection ("Remote end closed connection without
    # response") on an otherwise healthy link — the same flakiness that
    # corliss_uv_http_timeout already exists to absorb for uv's own downloads.
    # A one-off blip here fails the whole provision run, which is a poor trade
    # for a task that is safe to repeat: the checksum makes a partial or
    # substituted download a hard failure rather than something a retry could
    # paper over.
    - name: Download the pinned uv release tarball
      ansible.builtin.get_url:
        url: "{{ corliss_uv_url }}"
        dest: /tmp/uv-{{ corliss_uv_version }}.tar.gz
        checksum: "sha256:{{ corliss_uv_sha256 }}"
        mode: "0644"
      register: corliss_uv_download
      retries: 3
      delay: 5
      until: corliss_uv_download is succeeded

    - name: Extract the uv tarball
      ansible.builtin.unarchive:
        src: /tmp/uv-{{ corliss_uv_version }}.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install uv and uvx into the install dir
      ansible.builtin.copy:
        src: "/tmp/uv-x86_64-unknown-linux-gnu/{{ item }}"
        dest: "{{ corliss_uv_install_dir }}/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      loop:
        - uv
        - uvx

# One task provisions the whole environment: run from the checkout, `uv sync`
# creates the venv itself (no separate `uv venv`, no python3-venv apt package),
# fetches a managed CPython of the version pinned in the app's committed
# .python-version (3.14 — Debian 13 ships 3.13, so the system interpreter is
# unusable here), and installs the exact tree in uv.lock.
#
# --locked makes the deploy FAIL if uv.lock is stale against pyproject.toml
# rather than quietly resolving something else — that's the point of it: the CT
# runs precisely the tree committed at corliss_version. --no-dev keeps
# dev-only tooling off the CT. Together with the lockfile, this is what makes
# corliss_version a true pin of the whole dependency tree (requirements.txt
# never was one — it only ever pinned the app's own ref).
#
# Both env vars are load-bearing:
#   UV_PROJECT_ENVIRONMENT redirects the venv out of uv's default location
#     (.venv INSIDE the source tree) to corliss_venv — the path the systemd
#     unit's ExecStart, the manage.py tasks below and the recursive chown all
#     address literally. Without it every one of those breaks.
#   UV_PYTHON_INSTALL_DIR forces the managed interpreter UNDER corliss_home
#     (not uv's default /root/.local/share/uv/python) so the chown owns it and
#     ProtectHome=true in the unit doesn't hide it from the daemon.
# UV_HTTP_TIMEOUT lifts uv's stingy 30s per-request default so the interpreter
# tarball doesn't time out mid-download on the NAT'd link.
#
# uv prints "Checked N packages" to stderr when the environment already matches
# the lock — the only no-change signal. NOT "Audited", which is `uv pip
# install`'s wording (verified on uv 0.11); keying on that would report changed
# every run and notify a pointless restart.
- name: Sync the venv from the checkout's uv.lock
  ansible.builtin.command:
    cmd: "{{ corliss_uv_bin }} sync --locked --no-dev"
  args:
    chdir: "{{ corliss_src }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ corliss_venv }}"
    UV_PYTHON_INSTALL_DIR: "{{ corliss_python_install_dir }}"
    UV_HTTP_TIMEOUT: "{{ corliss_uv_http_timeout }}"
  register: corliss_uv_sync
  changed_when: "'Checked' not in corliss_uv_sync.stderr"
  notify: restart corliss

- name: Confirm the venv's base interpreter resolves under the role tree
  # Guards the load-bearing UV_PYTHON_INSTALL_DIR above: if the interpreter ever
  # lands outside corliss_home — a missed env var, or uv satisfying the request
  # from a system 3.14 someone installed — the daemon would fail to exec it
  # under ProtectHome=true. Fail loud at provision time instead of with a
  # cryptic unit start failure. Same guard as the open-webui role.
  ansible.builtin.command:
    cmd: >-
      {{ corliss_venv }}/bin/python -c "import sys; print(sys._base_executable)"
  register: corliss_base_py
  changed_when: false
  failed_when: not (corliss_base_py.stdout | trim).startswith(corliss_home)

# Static assets (base.css, vendored fonts) are collected into STATIC_ROOT here;
# whitenoise (installed above) serves them straight out of gunicorn — no
# separate nginx-for-statics box needed. No DB/secrets required for this
# command, just a loadable settings module.
- name: Collect corliss's static assets
  ansible.builtin.command:
    cmd: "{{ corliss_venv }}/bin/python manage.py collectstatic --noinput"
  args:
    chdir: "{{ corliss_src }}"
  environment:
    SECRET_KEY: "{{ corliss_secret_key }}"
  register: corliss_collectstatic
  changed_when: "'0 static files copied' not in corliss_collectstatic.stdout"
  notify: restart corliss

# --- Secrets: signing keys + env file -----------------------------------------

- name: Render the atproto EC (ES256) signing key
  # Generated once on the control node (group_vars/all/main.yml, cached under
  # /root/.zai-secrets) and templated here — DR-critical, covered by the
  # existing Tier-1 control-node backup. Group-readable: the Django process
  # (not systemd) reads this path directly via ATPROTO_EC_PRIVATE_KEY_PATH.
  ansible.builtin.copy:
    content: "{{ corliss_atproto_ec_key }}"
    dest: "{{ corliss_atproto_ec_key_path }}"
    owner: root
    group: "{{ corliss_group }}"
    mode: "0640"
  no_log: true
  notify: restart corliss

- name: Render the OIDC RSA (RS256) signing key
  ansible.builtin.copy:
    content: "{{ corliss_oidc_rsa_key }}"
    dest: "{{ corliss_oidc_rsa_key_path }}"
    owner: root
    group: "{{ corliss_group }}"
    mode: "0640"
  no_log: true
  notify: restart corliss

- name: Render the corliss secret environment file
  # DATABASE_URL, SECRET_KEY, key paths, OIDC client secret. 0600 root — only
  # systemd reads it via EnvironmentFile, before it drops to the corliss user.
  ansible.builtin.template:
    src: corliss.env.j2
    dest: "{{ corliss_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart corliss

# --- Database migration (provision-time, before the daemon ever starts) ------

- name: Apply corliss database migrations
  ansible.builtin.command:
    cmd: "{{ corliss_venv }}/bin/python manage.py migrate --noinput"
  args:
    chdir: "{{ corliss_src }}"
  environment:
    DATABASE_URL: "{{ corliss_database_url }}"
    SECRET_KEY: "{{ corliss_secret_key }}"
  register: corliss_migrate
  changed_when: "'No migrations to apply' not in corliss_migrate.stdout"
  no_log: true
  notify: restart corliss

- name: Ensure the break-glass local admin exists
  # Idempotent: only sets the password at creation (never rotates it), but
  # re-asserts is_staff/is_superuser on every run so this stays a reliable way
  # in even if something else flipped those flags off — see the command's
  # own docstring. Never writes CORLISS_ADMIN_PASSWORD into the persistent
  # env file; it's a one-shot creation input the running app never needs again.
  ansible.builtin.command:
    cmd: "{{ corliss_venv }}/bin/python manage.py ensure_admin"
  args:
    chdir: "{{ corliss_src }}"
  environment:
    DATABASE_URL: "{{ corliss_database_url }}"
    SECRET_KEY: "{{ corliss_secret_key }}"
    CORLISS_ADMIN_PASSWORD: "{{ corliss_admin_password }}"
  register: corliss_ensure_admin
  changed_when: "'unchanged' not in corliss_ensure_admin.stdout"
  no_log: true

- name: Give the corliss user ownership of its home (venv, interpreter, source)
  # clone/sync/migrate ran as root; the daemon runs as corliss and needs to read
  # the uv-managed interpreter, the venv and the app source. Runs AFTER all of
  # that, so it covers the managed CPython under corliss_python_install_dir too.
  ansible.builtin.file:
    path: "{{ corliss_home }}"
    state: directory
    owner: "{{ corliss_user }}"
    group: "{{ corliss_group }}"
    recurse: true

# --- Unit + smoke test --------------------------------------------------------

- name: Install the corliss systemd unit
  ansible.builtin.template:
    src: corliss.service.j2
    dest: /etc/systemd/system/corliss.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart corliss

- name: Ensure corliss is started and enabled
  ansible.builtin.systemd:
    name: corliss
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending corliss restarts before the smoke test
  ansible.builtin.meta: flush_handlers

- name: Wait for corliss to accept connections
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ corliss_port }}"
    timeout: 90

- name: Verify the corliss OIDC discovery document responds
  # Proves the app booted, reached the (migrated) DB, and the signing keys
  # loaded — not merely that the port is open (signing.py fails closed on a
  # missing/misconfigured key, which would 500 here).
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ corliss_port }}/.well-known/openid-configuration"
    status_code: 200
  register: corliss_health
  until: corliss_health is succeeded
  retries: 10
  delay: 3
