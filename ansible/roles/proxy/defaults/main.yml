---
# Caddy — the cluster's reverse-proxy edge. Routes are declarative and committed
# here (caddy_proxy_hosts), not held in a UI/SQLite DB, so the CT holds no
# unreproducible state (config in git, cert in the vault).

# Where the Cloudflare Origin CA cert/key land on the CT. The material itself is
# a secret and comes from the vault (cloudflare_origin_cert/_key); these are just
# the install paths the Caddyfile points its `tls` directive at.
caddy_cert_path: /etc/caddy/cloudflare-origin.pem
caddy_key_path: /etc/caddy/cloudflare-origin.key

# How this edge gets its certificate. Which mode is right depends on what sits in
# front of the proxy CT, and that is a fact about the deployment, not the role:
#
#   origin_ca  Cloudflare PROXIES the domain (orange cloud) and runs Full (strict)
#              to this origin. The long-lived Origin CA cert comes from the vault.
#              Only Cloudflare trusts that cert, so it is useless anywhere else.
#   acme       The domain resolves straight to this edge (DNS-only, grey cloud, or
#              no Cloudflare at all). Caddy obtains and renews its own Let's
#              Encrypt cert per hostname over HTTP-01, so public :80 MUST reach
#              the proxy CT. Nothing about the cert lives in the vault or git.
#   none       Plain HTTP on :80. Either no cert exists yet (bring the CT up and
#              smoke-test it first), or an external edge terminates TLS in front
#              of this one (see caddy_trusted_proxies).
#
# The default keeps the pre-mode behaviour: a vault holding the Origin CA cert
# gets origin_ca, anything else gets none. So an existing cluster renders exactly
# what it did before, and acme is only ever an explicit per-cluster choice.
caddy_tls_mode: "{{ 'origin_ca' if cloudflare_origin_cert is defined else 'none' }}"

# Derived, not a knob: "does this edge serve :443 at all". Kept because the :80
# redirect and the https:// site addresses care only about that, not about where
# the cert came from. Set caddy_tls_mode instead of overriding this.
caddy_tls_enabled: "{{ caddy_tls_mode != 'none' }}"

# Let's Encrypt account contact, acme mode only, rendered as Caddy's global
# `email` option when set. Not a secret, so it belongs here or in group_vars, not
# the vault. Do not treat it as a renewal alarm: Let's Encrypt no longer sends
# expiry reminders, so a failing renewal shows up in `journalctl -u caddy` first.
caddy_acme_email: ""

# Data-driven proxy routes — the reproducibility win. Each entry maps a
# public domain to an internal service; the upstream IP is DERIVED from that
# service's CTID via hostvars (10.1.1.<ctid>), never hardcoded — same convention
# the inventory uses. The domain derives from cluster_domain (set per cluster with
# `zai-set-domain`), so the committed route carries no this-cluster facts either.
# The :80 health/redirect site keeps the Caddyfile valid even with no routes.
#
# Optional `redirects: [{ from, to, code, skip_if_cookie }]` per entry —
# edge-level 302s (Caddy `handle <from> { redir <to> <code> }`, evaluated
# before the catch-all reverse_proxy) for cases the upstream app can't do
# itself. open-webui's is the motivating case: it has no native "skip
# straight to the only OAuth provider" option (open-webui/open-webui#24325),
# so /auth* is redirected straight to the OIDC login route instead of
# showing an intermediate page.
#
# `skip_if_cookie: token` is load-bearing, not optional polish: open-webui's
# OIDC callback always finishes by redirecting the browser BACK to this same
# /auth path (its frontend reads the just-set `token` session cookie there
# and completes login client-side) — a blind /auth* redirect also catches
# that completion request and bounces it into a fresh OIDC round-trip
# forever (the app-side log shows a successful token exchange on every
# cycle, the browser just never lands). Only shortcut to the provider when
# that cookie is genuinely absent (a first-time visitor); let a request that
# already carries it fall through to the real app instead.
caddy_proxy_hosts:
  - { domain: "api.{{ cluster_domain }}", service: litellm, port: 4000 }
  - domain: "chat.{{ cluster_domain }}"
    service: open-webui
    port: 8080
    redirects:
      - from: "/auth*"
        to: "/oauth/oidc/login"
        code: 302
        skip_if_cookie: token
  - { domain: "view.{{ cluster_domain }}", service: happyview, port: 3000 }
  # Corliss owns the APEX (ADR-0006), not a subdomain: its OIDC issuer is the
  # bare origin, and discovery has to sit at <issuer>/.well-known/... . Note
  # this is the one route a wildcard-only origin cert does NOT cover — the
  # cert must carry the apex as a SAN too.
  - { domain: "{{ cluster_domain }}", service: corliss, port: 8000 }

# --- Caddy package source and version ---------------------------------------
# Caddy comes from Debian BACKPORTS, not the base suite, and it is version-pinned
# like every other third-party binary here (Garage by URL + SHA-256, uv by
# tarball + checksum, corliss by git tag).
#
# Why backports: Debian 13 ships caddy 2.6.2-12, the same upstream version as
# Debian 12, and several Caddyfile options this cluster needs landed in 2.7 or
# later. `trusted_proxies` is the immediate one, and on 2.6.2 it is not merely
# ignored but a hard config error:
#
#   Error: adapting config using caddyfile: parsing caddyfile tokens for
#   'servers': unrecognized servers option 'trusted_proxies'
#
# Backports carries 2.11.2 and is still Debian-built and Debian-signed, so it
# needs no third-party apt key and none of the signing-key friction that the
# original "Debian's own package" choice was made to avoid. Caddy's official
# Cloudsmith repo was the alternative and was rejected for this reason: it would
# add a new trust root to get a capability backports already provides.
#
# The suite derives from the CT's own release so the blueprint stays generic.
# The version string does not, and cannot: `~bpo13` names Debian 13. A base
# image change means re-pinning here, which fails loudly at apt rather than
# silently installing something else.
caddy_backports_suite: "{{ ansible_distribution_release }}-backports"
caddy_apt_version: "2.11.2-1~bpo13+1"

# Addresses whose X-Forwarded-* headers Caddy should TRUST rather than overwrite.
# Empty by default, which renders no `servers` block at all, so a cluster where
# this Caddy is the outermost proxy behaves exactly as it did before this option
# existed. Leave it empty there: trusting an untrusted hop lets a client forge
# X-Forwarded-Proto.
#
# Set it only when something else terminates TLS in front of the proxy CT. Caddy
# otherwise rewrites X-Forwarded-Proto to its own connection scheme, which is
# `http` behind an external edge, so apps building absolute URLs emit http://
# links for a client that arrived over https. That breaks Django redirects and
# OIDC callbacks.
#
# A list of addresses or CIDRs, e.g. ["10.0.1.5"] for a single upstream edge, or
# a LAN subnet. It cannot be derived from the inventory, because the edge is
# outside the cluster by definition.
caddy_trusted_proxies: []
