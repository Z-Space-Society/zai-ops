---
# corliss — the cluster's ATProto→OIDC login bridge (Django). Internal-only on
# vmbr1; reached from the LAN only through the Caddy edge, fronted like
# litellm/open-webui/happyview.
#
# The app lives in its own repo (Z-Space-Society/Corliss) and is cloned onto
# the CT at a pinned ref, like every other role installs a pinned release —
# it used to be a sub-app of this repo, rsync'd off the control node's own
# checkout. See docs/decisions/0006-corliss-standalone-apex.md.

# Upstream app source. Public repo, so the clone needs no credentials — the CT
# reaches GitHub over the host's NAT. Pin to a TAG, never a branch: `git pull`
# on CT 100 updates the blueprint, but the app's version is this value, and
# bumping it is a reviewable commit like any other version pin in this repo. A
# branch would make replays silently pick up whatever moved upstream in between.
# A tag (not a bare SHA) also keeps `git describe --tags` in the CT's checkout
# reporting the release the CT is actually running.
#
# NOTE: unrelated to the `version` field in the app's pyproject.toml. That is
# package metadata, unread by anything (Corliss sets `package = false`); this is
# the git ref ansible.builtin.git checks out.
corliss_repo_url: https://github.com/Z-Space-Society/Corliss.git
# v0.6.1 makes v0.6.0 actually do its job. v0.6.0 decided who to send a
# logout_token to by reading its own OidcSession rows — which only start existing
# at the first token redemption AFTER it deploys, so on deploy day there are none
# and every already-live chat session was unreachable. Signing out of corliss left
# chat running, silently, because "this member holds no relying-party session" is
# a legitimate state the code passed over quietly. v0.6.1 drives delivery from the
# REGISTERED relying parties instead (known from config, true immediately) and
# uses a session row only to supply `sid`; open-webui resolves the member by
# `sub`, which corliss always has. Nothing to do on this side beyond the pin —
# same env key, same redis, no new variables.
#
# v0.6.0 ends relying-party sessions instead of waiting them out: corliss mints
# an OIDC logout_token and POSTs it to open-webui on sign-out, on a revocation
# push, and when a reconcile run deactivates someone. That closes the one hole
# GATE could not reach — v0.5.0 refuses a revoked member at /oidc/authorize, but
# open-webui only goes there when it has no session of its own, so revocation
# used to take effect at open-webui's next token expiry.
#
# **Needs two things provisioned first, or it is inert or broken:** the `redis`
# CT (open-webui cannot revoke an already-issued JWT without it), and the
# OIDC_BACKCHANNEL_LOGOUT_URI key in corliss.env.j2. A pin below v0.6.0 simply
# ignores that key, so the env file is safe either way.
#
# Note what this does NOT change: open-webui's JWT_EXPIRES_IN stays 4h. Immediate
# revocation now depends on a message being delivered, and the short expiry is
# the bound that still holds when it isn't.
#
# v0.5.0 enforces membership: /oidc/authorize, /api/ and the post-login resume
# refuse anyone who is not a member, so signing in with an atproto handle no
# longer reaches open-webui on its own. **This is the first pin whose safety
# depends on the membership cache being complete** — replay it only against a
# reconcile run reporting zero unresolved and zero orphans (the /manage/ Preview
# button), because an unresolved DID is a real member who gets locked out the
# moment this lands. Roster admins pass with no cache row at all, which is what
# keeps a rebuilt cluster enterable, and /manage/ and /admin/login/ stay
# ungated for the same reason — see the URL surface in docs/roles/corliss.md.
#
# v0.4.1 presents the registry's public Host when reaching it at its internal
# address — without it every reconcile run fails with HTTP 421 "Unknown host",
# so v0.4.0 is not usable with the internal MEMBERSHIP_REGISTRY_URL below.
#
# v0.4.0 reconciles membership from the registry, and serves the cluster console
# at /manage/. This is the membership half of the prime directive: until now the
# cache could only be filled by pushes, so a corliss rebuilt from nothing had no
# way to learn about grants that had already happened. Needs the three
# MEMBERSHIP_REGISTRY_* keys in corliss.env.j2 (a pin below v0.4.0 ignores them);
# reconciliation reports itself unconfigured until RECONCILE_TOKEN is also
# installed registry-side by scn-member-registry's `npm run deploy` — see
# Secrets in docs/roles/corliss.md.
#
# v0.3.2 adds the home page, the /api/ page and the nav's identity/admin menu —
# the surfaces API_URL and MANAGE_URL below feed — and reads the admin roster
# from the service DID's repo (SCN_SERVICE_DID). Those four env keys are set in
# corliss.env.j2; a pin BELOW v0.3.2 simply ignores them, so the env file is
# safe either way, but the links won't render.
#
# v0.3.0 added atproto membership caching, so a login no longer costs a live
# lookup against the user's PDS on every request.
#
# Since v0.2.1 the running version is stamped in every page footer, so which
# build is serving can be read off the site itself instead of by SSHing to the
# CT. It resolves from `git describe --tags` against the checkout this role
# clones — which works only because that clone is a full one at a tag (see the
# git task; don't add `depth:`), and reads back exactly the value pinned here.
#
# Floor: v0.2.0 adopted the uv project workflow (pyproject.toml + uv.lock
# replace requirements.txt, Python 3.14, Django 6.1). This role's `uv sync
# --locked` and v0.1.0 aren't compatible in either direction, so don't pin back
# past v0.2.0 without reverting the uv tasks with it.
#
# v1.1.0 adds workspaces: a named place a few members share, at /workspaces/.
# Making one takes a cluster membership; past that, being in a workspace is the
# whole permission and it is flat, so everyone in it can rename it and add or
# remove anybody, the creator included. **Needs a migration** (0006_workspace) —
# the role's migrate task already runs it, but a pin below v1.1.0 after this has
# been applied leaves an unused table rather than a broken app, so rolling back
# is safe and needs no manual step.
#
# No new env keys. Nothing changes in scn-member-registry or happyview: this is
# local Django rows and nothing talks to HappyView yet. The model carries an
# `automerge_root` column that stays blank until the notes editor lands.
#
# /account/ moved onto a Django form in the same release. Same fields, same
# behaviour, no env or schema change — worth knowing only because the page's
# markup changed, so a cached stylesheet is the thing to suspect if it looks
# wrong after the deploy.
#
# v1.0.0 gives members a name. A member was identified by DID, handle and email
# and nowhere by a name, so the console, the nav and the id_token handed to Open
# WebUI all showed a handle where a reader expects a person. Corliss now reads
# `displayName` off the member's own `app.bsky.actor.profile` record at login,
# and `/account/` lets them change it — along with their email — afterwards.
# **No new env keys**, and no new OAuth scope, so nobody re-consents (contrast
# v0.8.0, which did).
#
# **One migration** (`0005_user_display_name`) adds a blank column to the user
# table. It must run before the new code serves, which the migrate task below
# already guarantees.
#
# Three consequences worth knowing before pinning it:
#
# - **Names arrive as people sign in, not at deploy.** There is no backfill: the
#   column starts blank for everyone and login fills it. So the console looks
#   unchanged on deploy day and fills in over the following days. That is the
#   fill-blanks rule working, not a half-finished deploy.
# - **Once a member has an email in Corliss, a change at their PDS stops
#   propagating.** Login used to overwrite the email every time; it now only
#   fills a blank one, because `/account/` lets the member set it and an edit
#   that reverted at their next sign-in would make that page a lie. Both fields
#   are display-only — DID is what everything keys on — and clearing a field on
#   `/account/` re-arms the fill.
# - **Open WebUI picks the name up with no config change.** The id_token gains a
#   `name` claim, which is what an RP displays; `OAUTH_USERNAME_CLAIM=handle`
#   stays as it is, since the handle is still what the RP keys the account on.
#
# A pin below v1.0.0 is the old behaviour with an unused column left behind,
# which is harmless — the older code neither reads nor writes it.
#
# v0.9.3 makes /systems/ tell the truth. It has listed the stack since v0.7.2
# and reported "unknown" for everything but itself and Postgres; it now asks each
# service directly and reports up, down, or unknown. The probes are read-only
# liveness endpoints, one hop over vmbr1, fanned out concurrently with a 2s
# timeout and cached, so the page costs one timeout rather than eight and a dead
# service costs it once per window rather than once per load.
#
# **Needs the four new keys in the "Health probes" section at the foot of this
# file** — SYNC_RELAY_URL, REDIS_URL, GARAGE_S3_URL and CADDY_HEALTH_URL. They
# are the only services corliss had no address for; HappyView, LiteLLM and Open
# WebUI reuse the addresses it already calls them on.
#
# Two consequences worth knowing before pinning it:
#
# - **This role now fails if sync-relay, redis, object-store or proxy has no
#   CTID assigned.** The four URLs derive from hostvars unguarded, the same
#   idiom and reasoning as corliss_membership_registry_url. `zai-assign
#   <service> <ctid>` is the fix. It is an inventory dependency, not an ordering
#   one — no facts are read from those hosts, so their plays need not have run.
# - **A pin below v0.9.3 ignores the four keys** and the page reverts to
#   reporting "unknown", which is the state it shipped in. Nothing fails.
#
# Blank is a working state on corliss's side and means "unknown", never "down" —
# a value it cannot dial is a question it cannot answer, not an outage.
#
# It also drops the page's "Manage Console" row, which described static files
# already deleted with the manage_console role — the same deletion that is why
# corliss_manage_url above is deliberately blank. Every remaining row is a
# service something can be asked about.
#
# v0.9.2 adds the other half of a decision: an application can be DECLINED from
# the queue, where until now the only way to answer "no" was to leave the row
# sitting there. It needs nothing deployed at the registry — a decline writes an
# ordinary revocation, and with no grant before it that is already what "not a
# member" resolves to under latest-event-wins. The decision survives a reconcile
# (the revocation is an admin-authored event, so the DID is accounted for rather
# than orphaned), which is what keeps a declined applicant out of the queue after
# a rebuild. The record carries `reason: "Application declined."` so the log does
# not read as revoking a membership that never existed, and Decline refuses when
# the subject is a current member — the queue can hold one, flagged "asked
# again", and there it would silently revoke a sitting member. Applicants' handles
# also link out to their bsky.app profile now (by DID, since handles are mutable).
# No new env keys, no migration; a pin below v0.9.2 has no decline button.
#
# v0.9.1 is the membership console's presentation only — no new env keys, no
# migration, and nothing changes in scn-member-registry or happyview. The
# members table stopped scrolling sideways: every per-member write (tier,
# revoke, appoint/retire admin) moved out of a `Change` column and into a
# panel opened by clicking the member's handle, which also carries their DID
# and who granted them. The panel is pure CSS `:target` — no JavaScript,
# deliberately, because `/manage/` holds the reconcile button and is how a
# Corliss rebuilt from nothing gets its membership back. Members now sits
# above Applications, the service-session lock is a drawn icon reading
# "Admin Locked"/"Admin Unlocked" rather than an emoji, and page titles read
# "— SCN". A pin below v0.9.1 is the old layout and is otherwise identical
# in behaviour.
#
# v0.9.0 brings admin roster editing into the console: appoint and retire
# cluster admins from `/manage/`, which is the last thing the Manage Console was
# still needed for. Appointing does BOTH halves — the roster entry in the
# service DID's repo, and registry space write access via the registry's
# `setSpaceAccess` — because space membership is what makes a grant
# authoritative at HappyView, so an admin holding only the roster entry can
# reach the console and cannot approve anyone. Retiring stamps `removedAt`
# (never deletes: the record is the history of who held authority and when) and
# removes space access. No new env keys, and no migration.
#
# Two operational consequences:
#
# - **The service account has to be signed in, and there is a lock on the
#   console to do it.** The roster record lives in the service DID's own repo,
#   so only that account can write it — `/manage/unlock` authenticates it
#   through the ordinary callback route, so no second redirect URI and no
#   re-consent for anyone else. Its login is also the only one that asks for a
#   wider atproto scope (`_scope_for`), so members are untouched by this. Two
#   sessions expire independently and only the PDS one self-refreshes; the
#   console names which of them died, because only the registry one is worth
#   signing in over.
# - **The space-access half is reported, never raised.** If it fails the roster
#   write has already landed and stands; the console says so and asks for the
#   same action again, which both halves are idempotent under.
#
# `make_admin` no longer hands out Django `is_superuser` along with roster
# authority — the two were never the same grant. A pin below v0.9.0 leaves
# roster editing in the Manage Console, where it was.
#
# v0.8.3 fixes v0.8.2: every approve came back 401 "DPoP proof htu mismatch",
# so no admin could actually decide anything. The proof named corliss's
# INTERNAL address for the registry while the registry reconstructs the request
# URI from the public `Host` corliss presents — the same
# internal-address-with-a-public-name trap as the HTTP 421 that v0.4.1 fixed,
# one layer up. Pin v0.8.2 and the buttons are there and refuse to work.
#
# v0.8.2 lets an admin answer an application without leaving Corliss: approve,
# change a tier, and revoke, from `/manage/`. This is the write half of the
# membership loop, and it retires the Manage Console for everything except
# roster editing.
#
# **It needs `MEMBERSHIP_REGISTRY_CLIENT_KEY` set, which reads and reconciles
# never did.** A grant is a write to the registry space, and the registry takes
# one only from the approving admin's own DPoP-authenticated session — no
# shared token can produce a proof, which is exactly what stops one authoring
# a grant. Corliss gets that session by asking the registry to provision a DPoP
# key during an **admin's** login and running the atproto handshake with it, so
# nothing new is stored beyond a timestamp saying the session exists.
#
# Three operational consequences:
#
# - **Admins must sign out and in again** after this deploys. A session
#   established before it has no registry session, and `/manage/` says so with
#   its buttons disabled rather than failing at the click.
# - **A registry outage degrades to "no approvals", never to "no login".** If
#   provisioning fails the login falls back to Corliss's own key and completes;
#   the failure is a `registry key provision failed` line in the journal.
# - **One migration** (`0004_registry_session`) adds a nullable timestamp to
#   the token table. It must run before the new code serves traffic, which the
#   migrate task below already guarantees.
#
# Non-admin logins are untouched, and the registry never sees a non-admin's
# tokens. Nothing changes in scn-member-registry or happyview: the lexicons and
# the Lua that enforce the roster check are already deployed and unmodified.
#
# v0.8.1 tightens what v0.8.0 shipped, from testing it on the cluster. The
# applications panel lists only what is still awaiting a decision — it was
# listing every application ever made, which made it a second copy of the
# member table. And the nav now shows a signed-in non-member the Chat and API
# entries as disabled rather than telling them the opposite of the truth in
# both directions: Chat was a live link that GATE would refuse, API was absent.
# Copy, template and CSS only — no new env keys, no migration.
#
# v0.8.0 closes the membership loop from both ends: /manage/ lists everyone who
# has applied, and the home page's apply button now works. Applying writes a
# `membership.request` record into the APPLICANT'S OWN PDS — corliss already
# holds their tokens from login, so it writes there directly and needs no
# HappyView session for it. No new env keys, and no migration. The console
# panel reads the registry's `listRequests`, which needs only
# `MEMBERSHIP_REGISTRY_URL` and deliberately not the reconcile token.
#
# Two operational consequences, neither a fault:
#
# - **Every existing member re-consents on their next sign-in.** The OAuth
#   scope narrowed from `transition:generic` (write any record type in the
#   member's repo) to `repo:network.sharedcomputer.membership.request` with
#   create/update/delete, so stored tokens no longer carry what corliss now
#   asks for. Old tokens still read; a member who applies before re-authorising
#   takes the new refresh path, and is told to sign in again if that fails.
# - **A pin below v0.8.0 leaves the apply button inert**, as it was — the stub
#   says so on the page rather than failing.
#
# Nothing changes in scn-member-registry or happyview for this: the request
# lexicon is already published and indexed, so there is no Lua to deploy and no
# script variable to set.
#
# v0.7.3 welcomes members on the home page and points them at chat and at their
# own API keys. Copy only — no new env keys.
#
# v0.7.2 adds /systems/ (the stack, status stubbed), reorders the membership
# console, and fills out the Manage menu: LiteLLM, HappyView and Proxmox admin
# links. Needs `HAPPYVIEW_URL` and `PROXMOX_URL` in corliss.env.j2; both are
# derived here (view.<domain>, and the host's LAN address from the vault), and
# a pin below v0.7.2 ignores them.
#
# v0.7.1 adds an "API admin" entry to the nav's Manage menu, linking LiteLLM's
# own admin UI at `API_URL` + /ui/ for cluster admins. No new env keys — it is
# derived from `corliss_api_url`, which already exists.
#
# v0.7.0 — members issue their own LiteLLM API keys from /api/. Needs the three
# `LITELLM_*` keys in corliss.env.j2 and the litellm role having run at least
# once (it mints the provisioner key and creates the tier teams); a pin below
# v0.7.0 ignores those keys, and a pin at v0.7.0 with them unset leaves /api/
# saying it is not configured rather than failing.
corliss_version: v1.1.0

# Port gunicorn binds. 8000 matches the app's own local-dev convention
# (PUBLIC_BASE_URL=http://localhost:8000 in .env.example). Bind 0.0.0.0 (not
# loopback) — same posture as litellm/open-webui — the Caddy edge reaches this
# CT over vmbr1, and the security boundary is the network, not the bind address.
corliss_port: 8000
corliss_host: "0.0.0.0"
corliss_gunicorn_workers: 2

# Dedicated unprivileged service account (nologin) the daemon runs as.
corliss_user: corliss
corliss_group: corliss

# On-disk layout, all under /opt like every other native service. src/ is the
# cloned app checkout (reset to corliss_version on every run); venv/ is layered
# on top of it — `uv sync` builds it there rather than at the source tree's
# default src/.venv because the tasks set UV_PROJECT_ENVIRONMENT to this path.
#
# The uv-managed CPython is deliberately placed UNDER corliss_home (not uv's
# default ~/.local/share/uv/python), same as open-webui, so that: (a) the
# recursive chown at the end of the role owns it, and (b) ProtectHome=true in
# the unit — which hides /root — never hides the interpreter the daemon execs.
corliss_home: /opt/corliss
corliss_src: "{{ corliss_home }}/src"
corliss_venv: "{{ corliss_home }}/venv"
corliss_python_install_dir: "{{ corliss_home }}/python"

# uv — provisions the venv from the checkout's pyproject.toml + uv.lock, and
# fetches the managed CPython to build it against. Installed reproducibly from
# a pinned, checksummed release tarball (NOT `curl | sh` of a moving
# installer), same idiom and same pin as the open-webui role. Like open-webui,
# corliss DOES need uv's managed-CPython fetch: the app requires Python 3.14
# (pinned in its committed .python-version) and Debian 13 ships 3.13.
#
# There is deliberately no corliss_python_version var here: the app's
# .python-version is the single source of truth and uv reads it off the
# checkout, so a role var would only be a second copy to drift.
# Releases: https://github.com/astral-sh/uv/releases
corliss_uv_version: "0.11.25"
corliss_uv_sha256: "1db18b5e76fa645a7f3865773139bdec8e2d46adbdbb35e7410b34fa8015ccd2"
corliss_uv_url: "https://github.com/astral-sh/uv/releases/download/{{ corliss_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
corliss_uv_install_dir: /usr/local/bin
corliss_uv_bin: "{{ corliss_uv_install_dir }}/uv"

# Per-request HTTP timeout (seconds) for uv's downloads. uv defaults to 30s,
# which the managed-CPython tarball (tens of MB, fetched on a cold CT) can blow
# past on the host's NAT'd link. Corliss's own dependency set is small — no
# torch-sized wheel like open-webui's — so this is a modest lift, not
# open-webui's 900. uv caches under /root/.cache/uv, so a re-run after a
# partial download resumes rather than refetching.
corliss_uv_http_timeout: 180

# Config + secrets live under /etc, like every other role. The env file (0600,
# root-only) carries DATABASE_URL/SECRET_KEY/etc; the keys/ dir holds the two
# PEM signing keys, group-readable so the daemon (not just systemd) can read
# them directly — Django loads them itself via ATPROTO_EC_PRIVATE_KEY_PATH /
# OIDC_RSA_PRIVATE_KEY_PATH, unlike the env file which only systemd reads.
corliss_config_dir: /etc/corliss
corliss_env_file: "{{ corliss_config_dir }}/corliss.env"
corliss_keys_dir: "{{ corliss_config_dir }}/keys"
corliss_atproto_ec_key_path: "{{ corliss_keys_dir }}/atproto_ec.pem"
corliss_oidc_rsa_key_path: "{{ corliss_keys_dir }}/oidc_rsa.pem"

# Postgres role + database this role provisions on the postgres CT (same
# delegated idiom as litellm/open-webui/happyview). Password is the
# auto-generated corliss_db_password from group_vars/all/main.yml.
corliss_db_name: corliss
corliss_db_user: corliss
corliss_database_url: "postgresql://{{ corliss_db_user }}:{{ corliss_db_password }}@{{ hostvars['postgres'].ansible_host }}:5432/{{ corliss_db_name }}"

# Public URL: the APEX domain, not a subdomain (was account.<domain> until
# ADR-0006). Anchors PUBLIC_BASE_URL, the atproto OAuth client_id, and the OIDC
# issuer — and the issuer is why it's the apex: an OIDC issuer of
# https://example.com must serve discovery at https://example.com/.well-known/
# openid-configuration, so a bare-origin issuer needs the bare origin. The app
# keeps its human/atproto surface under /auth/* and leaves / to the account
# page. NOTE: the origin cert must cover the apex, not just *.<domain>.
corliss_url: "https://{{ cluster_domain }}"
corliss_allowed_hosts:
  - "{{ cluster_domain }}"
  # 127.0.0.1: the role's own provision-time smoke test hits the app over
  # loopback (Verify the corliss OIDC discovery document responds), and
  # Django's ALLOWED_HOSTS check 400s any Host header not on this list —
  # without this, the health check fails even though gunicorn is up fine.
  - "127.0.0.1"
  # This CT's own internal address, because the SCN registry pushes membership
  # events to it CT-to-CT over vmbr1 rather than out through Caddy — so the
  # Host header on those POSTs is the bare `10.1.1.<ctid>:8000`, which the two
  # entries above do not cover. Django rejects a Host that is not listed here
  # with a 400 *before* the view runs, so without this the push fails in the
  # worst possible way: the endpoint looks deployed, the registry's Lua logs a
  # 400 it cannot explain, and the membership cache silently stays empty.
  # Derived from the CTID via hostvars, never hardcoded (same rule as
  # corliss_database_url).
  - "{{ hostvars['corliss'].ansible_host }}"

# The one OIDC relying party today: Open WebUI. client_id is a LOCAL default
# here (not reached into the open-webui role's vars) — mirror it in
# open-webui's own defaults (openwebui_oidc_client_id) and keep both in sync,
# same convention as openwebui_litellm_port/litellm_port.
corliss_oidc_client_id: open-webui
corliss_oidc_redirect_uris:
  - "https://chat.{{ cluster_domain }}/oauth/oidc/callback"

# Open WebUI's back-channel logout endpoint — where corliss POSTs a logout_token
# on sign-out and on revocation. INTERNAL (derived from open-webui's CTID via
# hostvars), unlike the redirect URI above: that one is a URL a member's browser
# follows, this one is a call between two CTs on the same bridge. Same
# distinction, and the same reasoning, as corliss_membership_registry_url below.
#
# The port is a LOCAL default rather than a reach into the open-webui role's
# vars (a role default isn't a reliable host fact from this play) — keep it in
# sync with openwebui_port, same convention as corliss_oidc_client_id mirroring
# openwebui_oidc_client_id.
corliss_openwebui_port: 8080
corliss_oidc_backchannel_logout_uri: "http://{{ hostvars['open-webui'].ansible_host }}:{{ corliss_openwebui_port }}/oauth/backchannel-logout"

# The other cluster surfaces corliss links out to. All three derive from
# cluster_domain exactly like corliss_url above — just different subdomains, so
# a `zai-set-domain` moves every link at once and none of them can drift. Each
# is the SAME public origin the corresponding Caddy route already serves
# (caddy_proxy_hosts), reached through the edge rather than CT-to-CT, because
# these are hrefs a member's browser follows, not service-to-service calls.
#
# Blank hides the corresponding link/block in the app, which is why they're
# derived rather than required: nothing here fails when a surface is absent.
corliss_chat_url: "https://chat.{{ cluster_domain }}"     # nav "Chat" link
corliss_api_url: "https://api.{{ cluster_domain }}"       # base URL shown on /api/
corliss_happyview_url: "https://view.{{ cluster_domain }}"  # Manage menu, admins only

# Deliberately BLANK, and not derived like the three above. The Manage Console
# SPA it pointed at was deleted with the manage_console role, so
# manage.{{ cluster_domain }} now resolves to nothing — a derived value here
# would render a live-looking link to a dead origin. Corliss treats blank as
# "no console" and drops the fallback offer on /manage/ (its own console has
# covered everything the SPA did since v0.9.0, roster editing included), so the
# knob stays for a cluster that stands a second admin surface up at some other
# origin. Nothing in corliss requires it.
corliss_manage_url: ""

# The Proxmox host's own web UI, linked from the Manage menu for cluster admins.
#
# Derived from `proxmox_api_host` — the host's LAN address, recorded by
# bootstrap.sh and held in the vault — rather than from `cluster_domain` like
# every other link here. It has to be: the Proxmox UI runs on the HOST, not a
# CT, so it is not one of `caddy_proxy_hosts` and there is no subdomain to
# derive. This is the one admin link that points off the edge entirely, at the
# LAN, which is also why it needs no route and no cert of ours.
#
# Two consequences to expect rather than debug: the host serves a self-signed
# cert on 8006, so browsers warn; and this is reachable only from the LAN or a
# VPN, unlike the rest of the Manage menu.
#
# Putting Proxmox behind the Caddy edge (`ops.<domain>`) would fix both, and is
# deliberately not done here — exposing the hypervisor's admin UI publicly is a
# trust-model decision, not a config one. If that lands, this becomes
# `https://ops.{{ cluster_domain }}` and Corliss needs no change.
corliss_proxmox_url: "https://{{ proxmox_api_host }}:8006"

# --- LiteLLM: where Corliss issues members' API keys ------------------------
# Deliberately NOT corliss_api_url above. That one is the public origin a MEMBER
# points their client at; this is Corliss reaching the same service from the CT
# next door, and the two must not be conflated:
#
# - **Server-side Python cannot fetch our own public origin.** Cloudflare's
#   Browser Integrity Check refuses non-browser user agents with `error code:
#   1010` — the trap that shipped back-channel logout fully built and inert.
#   See docs/roles/open-webui.md, "the public origin is resolved internally".
# - The provisioner key has no business crossing an edge to reach a neighbour.
#
# Unlike the registry there is no _host companion: LiteLLM does not route by
# virtual host, so a bare-IP Host needs no compensating header (HappyView's
# HTTP 421 problem does not exist here).
#
# The port is a LOCAL default rather than a reach into the litellm role's vars —
# same convention as corliss_openwebui_port above. Keep in sync with litellm_port.
corliss_litellm_port: 4000
corliss_litellm_url: "http://{{ hostvars['litellm'].ansible_host }}:{{ corliss_litellm_port }}"

# How many API keys one member may hold. LiteLLM enforces no per-user limit, so
# this cap is ours or there is none.
corliss_litellm_max_keys_per_member: 5

# The provisioner key, MINTED BY THE litellm ROLE and read back from the control
# node's secrets file — which is why the litellm play runs before this one in
# provision.yml (see the comment on the corliss play there). A `proxy_admin`
# virtual key, not the master key: it can mint and delete keys for any member,
# so a compromised Corliss costs one revocation rather than a proxy-wide
# rotation. DR-critical in the same way every other entry in .zai-secrets is —
# lose the file and the next run mints a new key, leaving the old proxy_admin
# key live and unused until it is deleted by hand.
corliss_litellm_provisioner_key: "{{ lookup('ansible.builtin.file', _zai_secrets_dir ~ '/corliss_litellm_provisioner_key') }}"

# The HappyView instance corliss reads membership back out of, for reconciliation
# (`manage.py reconcile_membership`, and the button on corliss's own /manage/).
#
# **Internal, not the public origin.** Unlike chat/api/manage above — hrefs a
# member's browser follows — this is a service-to-service call between two CTs on
# the same bridge, so it goes direct: one hop over vmbr1, never leaving the
# cluster. `https://view.<domain>` would route out through the host's NAT, across
# the public internet and Cloudflare, and back in through the proxy CT.
#
# That matters because **this is the recovery path**. Reconciliation is what
# refills an empty MembershipCache on a rebuilt cluster, and it is meant to run
# at boot; making it depend on public DNS, Cloudflare and the proxy CT all being
# healthy is a long chain for something whose whole job is to work when little
# else does. One internal hop depends on the two CTs and nothing else. It also
# means the token is not the only thing standing in front of an
# internet-reachable endpoint.
#
# Derived from the inventory, not hardcoded — same idiom as this role's own
# `corliss_database_url` (`hostvars['postgres']`) and open-webui's
# `openwebui_openai_base_url` (`hostvars['litellm']`), so the CTID assignment
# stays the single source. Deliberately unguarded, like both of those: a
# happyview with no CTID assigned fails the play loudly rather than rendering a
# blank URL that would look like a working config.
#
# The port is a LOCAL default rather than a reach into happyview's role defaults,
# for the reason open-webui records: a role default isn't a reliable host fact
# from another play. It must match the `view.<domain>` entry in
# `caddy_proxy_hosts`.
#
# The address coupling is the one `CORLISS_PUSH_URL` already accepts in the other
# direction, and degrades the same gentle way: a wrong address means
# reconciliation reports a transport failure, visibly, while the registry and the
# push keep working.
corliss_membership_registry_url: "http://{{ hostvars['happyview'].ansible_host }}:{{ corliss_membership_registry_port }}"
corliss_membership_registry_port: 3000

# The Host header corliss presents on that internal call. happyview routes by
# virtual host and answers HTTP 421 "Unknown host" to a request whose Host is a
# bare 10.1.1.x — the edge normally preserves the public name on the way
# through, so going direct means presenting it ourselves. Same derivation as the
# `view.<domain>` entry in caddy_proxy_hosts, which is the name it routes on.
corliss_membership_registry_host: "view.{{ cluster_domain }}"

# --- Registry identity, set per cluster with `zai-set-registry` -------------
# These two lived in the manage_console role's defaults until that role was
# deleted; corliss is now the only consumer, so they are rehomed here rather
# than dropped. Neither is prefixed `corliss_*` on purpose: both are the
# REGISTRY's identity, not corliss's, and one identity should not be recorded
# twice under two names in the same inventory.
#
# Blank blueprint defaults — the real values are this-cluster identity and live
# in the git-ignored runtime inventory (ADR-0001). Neither is a secret: the DID
# is public information and the client key is public by construction and bound
# to an origin, which is what carries its security rather than its secrecy. A
# non-secret in the vault is the mistake this repo's conventions name outright.

# The service DID whose repo anchors the public admin roster. Corliss reads it
# for the ELEVATE roster check. Blank is a working state: the roster reads as
# empty, so nobody is elevated.
scn_service_did: ""

# The registry's public, origin-bound HappyView client key, passed through as
# MEMBERSHIP_REGISTRY_CLIENT_KEY for reconciliation reads. OPTIONAL, and blank
# is fully working — verified against production 2026-08-18 that HappyView
# dispatches to a Lua script with no session and no client key at all. It must
# stay optional, or a cluster rebuilt before the key was recorded could not
# reconcile its own membership, tying recovery to a setting rather than to the
# registry. The `console_` prefix now outlives the console; renaming it is a
# separate change, because the name is also what the runtime inventory already
# holds on the live cluster.
console_client_key: ""

# --- Health probes: what /systems/ dials -------------------------------------
#
# Corliss's /systems/ page reports whether the cluster is up, and asks each
# service directly rather than inferring anything. Everything it dials is
# INTERNAL — one hop over vmbr1 — for the reason recorded above
# corliss_litellm_url: server-side Python cannot fetch our own public origin
# through Cloudflare's Browser Integrity Check, so a probe aimed at a public
# origin would measure the edge instead of the service.
#
# READ-ONLY LIVENESS ENDPOINTS, all of them. None carries a credential and none
# can change anything, which is what makes handing this list to a page safe.
#
# Only four services need an entry. HappyView, LiteLLM and Open WebUI are already
# reached by address elsewhere in this file, and Corliss's probes reuse those
# settings — a second address for a host we already know is a second thing to get
# wrong, and they would drift.
#
# Derived from the inventory and DELIBERATELY UNGUARDED, the same idiom and the
# same reasoning as corliss_membership_registry_url above: a service with no CTID
# assigned fails the play loudly rather than rendering a blank that would look
# like working config. Corliss treats a blank as "unknown" and says so on the
# page, but that is its safety net for a deployment that never set these — not a
# licence for this role to hand it one silently.

# The Automerge sync server behind collaborative spaces. Probed at /health, which
# reports liveness WITHOUT touching Postgres — deliberately, so a database blip
# cannot get the relay restarted out from under live sync connections. So "up"
# means the process is serving, not that its storage works; Corliss says as much
# on the row rather than overclaiming.
#
# The port is a LOCAL default rather than a reach into the sync_relay role's
# vars — same convention as corliss_litellm_port above, for the reason
# open-webui records: a role default isn't a reliable host fact from another
# play. Keep in sync with sync_relay_port.
corliss_sync_relay_port: 7030
corliss_sync_relay_url: "http://{{ hostvars['sync-relay'].ansible_host }}:{{ corliss_sync_relay_port }}"

# Redis, as something to DIAL — not a cache backend. Corliss holds no Redis
# client and no redis dependency: the probe writes PING to a socket and reads the
# reply. The redis role sets requirepass, so the reply is `-NOAUTH`, and that
# refusal proves liveness as well as `+PONG` would — only a Redis that is up,
# listening and speaking its own protocol can produce it. No password is passed
# here and none is needed, which is the point: this stays a probe, not a
# credential.
corliss_redis_port: 6379
corliss_redis_url: "redis://{{ hostvars['redis'].ansible_host }}:{{ corliss_redis_port }}"

# Garage's S3 port — deliberately NOT its admin API, which garage.toml binds to
# 127.0.0.1:3903 and is therefore unreachable from the corliss CT. An
# unauthenticated GET on an S3 endpoint answers an XML error, so Corliss counts
# ANY HTTP status as up: a 403 from Garage is a serving Garage.
corliss_garage_s3_port: 3900
corliss_garage_s3_url: "http://{{ hostvars['object-store'].ansible_host }}:{{ corliss_garage_s3_port }}"

# Caddy's own health site on :80, which the Caddyfile serves whether or not TLS
# is enabled — it shares that listener with the HTTPS redirect. A full URL rather
# than an origin, because unlike the three above this names an endpoint Caddy
# publishes rather than the root of a service.
corliss_caddy_health_url: "http://{{ hostvars['proxy'].ansible_host }}/healthz"
