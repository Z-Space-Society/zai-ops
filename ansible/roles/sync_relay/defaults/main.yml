---
# Version to build from source. Bump here to upgrade; the role re-clones and
# rebuilds when this changes. target/ is kept between builds, so a bump
# recompiles the relay's own crate in a few minutes; the first build, and one
# after target/ is cleared for disk (sync_relay_min_free_gb), is a cold
# `cargo build --release` of 15-30 min. Either way, a restart.
#
# v0.1.1 serves the websocket at the URL root as well as at /sync, and the root
# is the one that matters: automerge-repo's WebSocketClientAdapter connects to
# exactly the URL it is given and appends no path, and the reference sync server
# serves at the root — so clients are configured with a bare ws://host:port. On
# 0.1.0 a stock client got a 404 instead of an upgrade, which presents as "sync
# silently never works" rather than as a routing error.
#
# v0.1.2 is a dependency release with no behaviour change of its own: samod
# 0.13 to 0.15 and sqlx 0.8 to 0.9. samod 0.15 rejects a handshake whose claimed
# identity does not match and messages aimed at another peer, both of which
# 0.13 only logged, and it is the base Phase B builds on.
#
# v0.2.0 is Phase B: it verifies Corliss-issued access tokens before the
# websocket upgrade, lets a member open only the vaults they own, serves
# /internal/vaults for Corliss's Notes page (its spec, section Z3), and adds the
# MCP service on a second listener. Needs Corliss v1.4.0, which issues those
# tokens, and the auth settings below; it refuses to start with auth on and any
# of them blank.
#
# v0.3.0 adds note_count and bytes to each vault in a listing, which Corliss's
# Notes page shows as Notes and Size. No new settings, no schema change.
#
# v0.4.0 lets a vault belong to one Corliss workspace instead of a member, from
# a `workspaces` claim in the token; v0.4.1 makes that claim a list of opaque
# workspace IDs and takes renames by PATCH /internal/vaults. A token with no
# such claim is a member in no workspace, so a Corliss that sends none keeps
# private vaults working. No new settings; the two new columns are added by the
# binary at startup (ADD COLUMN IF NOT EXISTS).
#
# v0.4.2 adds `path` to each vault in a listing ("Private/Notes",
# "Workspaces/<name>"), so MCP, Corliss and the Obsidian plugin read one
# spelling instead of each building it. No new settings, no schema change.
#
# v0.4.3 adds GET /internal/vaults/all, every vault with its creator and each
# member's documents that no vault reaches, for Corliss's admin view. Under
# /internal/, so the proxy's block_paths already keeps it off the edge. No new
# settings, no schema change.
#
# v0.4.4 adds the `file-unfiled` subcommand, run by hand with the service
# stopped, which files a member's documents that no vault reaches into a folder
# in their private vault. The service itself is unchanged: no new settings, no
# schema change.
#
# v0.5.0 gives each member one private vault, with no name, at the path
# "Private", made by the first listing that asks; a workspace's vault comes
# from PUT /internal/vaults/workspace, which replaces POST and PATCH. Corliss
# v1.10.0 is the caller of the new route, so it deploys right after this.
# Every syncing device must run SCN Sync 1.2.0 first. At startup the binary
# makes vaults.name nullable, clears private vaults' names and adds a unique
# index on one private vault per member; a member with two stops startup.
# No new settings.
sync_relay_version: "0.5.0"

# Below this much free disk under sync_relay_home, target/ is cleared before a
# build, which is then a cold one. The CT has 16 GB; a full build tree is
# several GB, and it grows as dependency versions change.
sync_relay_min_free_gb: 4

sync_relay_port: 7030
# Wildcard, never a literal 10.1.1.x. A container address loses a cold-boot race
# with systemd-networkd and the service comes up silently loopback-only — the
# failure mode that took the cluster down on 2026-08-20 via Postgres.
sync_relay_host: "0.0.0.0"

sync_relay_user: scn-sync-relay
sync_relay_group: scn-sync-relay
sync_relay_home: /opt/scn-sync-relay
sync_relay_bin: /opt/scn-sync-relay/bin/scn-sync-relay
sync_relay_src: /opt/scn-sync-relay/src
sync_relay_config_dir: /etc/scn-sync-relay
sync_relay_env_file: /etc/scn-sync-relay/scn-sync-relay.env

sync_relay_db_name: scn_sync_relay
sync_relay_db_user: scn_sync_relay
sync_relay_database_url: "postgresql://{{ sync_relay_db_user }}:{{ sync_relay_db_password }}@{{ hostvars['postgres'].ansible_host }}:5432/{{ sync_relay_db_name }}"

# Phase B: every connection carries a Corliss access token. True is also the
# binary's own default, so this line exists to be read, not to be changed. It
# was false through Phase A, while the relay had no verifier and no proxy route.
sync_relay_require_auth: true

# The MCP listener. Its own port so the proxy routes it under its own hostname,
# and so the sync listener's /internal/ paths can never be reached through it.
sync_relay_mcp_port: 7031

# Who issues the tokens the relay accepts: Corliss's public URL, exactly as
# Corliss's corliss_url spells it, because it is compared with each token's
# `iss`. A LOCAL default rather than a reach into the corliss role's vars (a
# role default is not a host fact from this play), same convention as
# corliss_sync_relay_port. Keep the two in sync.
sync_relay_oidc_issuer: "https://{{ cluster_domain }}"

# Where the relay fetches Corliss's signing keys: the internal address, one hop
# over vmbr1, never the public origin. Corliss already lists its own CT address
# in ALLOWED_HOSTS for the registry's push, so this Host is accepted. Port kept
# in sync with corliss_port.
sync_relay_corliss_port: 8000
sync_relay_oidc_jwks_url: "http://{{ hostvars['corliss'].ansible_host }}:{{ sync_relay_corliss_port }}/.well-known/jwks.json"

# The audiences: the same group_vars hostnames Corliss builds OIDC_RESOURCES
# from, so a token Corliss issues names exactly what the relay expects.
sync_relay_sync_audience: "https://{{ sync_relay_sync_host }}"
sync_relay_mcp_audience: "https://{{ sync_relay_mcp_host }}"

sync_relay_repo_url: "https://github.com/Z-Space-Society/scn-sync-relay"

# Pinned in the repo's own rust-toolchain.toml; rustup reads that file and
# installs the right toolchain regardless of what this channel says. Kept here
# so the bootstrap install has something to fetch on a cold CT.
sync_relay_rust_channel: stable
